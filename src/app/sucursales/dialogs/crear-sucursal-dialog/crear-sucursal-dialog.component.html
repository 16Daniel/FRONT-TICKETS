<p-dialog [header]="!esNuevaSucursal ? 'ACTUALIZAR SUCURSAL' : 'CREAR SUCURSAL'" [(visible)]="mostrarModalCrearSucursal"
  [modal]="true" [style]="{ 'width': '800px', 'max-width': '95vw' }" [maximizable]="true" (onHide)="onHide()">
  
  <form #form="ngForm" (ngSubmit)="enviar(form)" class="mt-3">
    <div class="row gy-4">
      
      <div class="col-12 col-md-6">
        <label class="rw-form-label">ID</label>
        <input [disabled]="true" class="form-control rw-input" type="text" placeholder="ID (Automático)"
          [(ngModel)]="sucursal.id" name="id" [ngClass]="{'p-invalid': formidCtrl.invalid && formidCtrl.touched}"
          #formidCtrl="ngModel" required>
        <small *ngIf="formidCtrl.invalid && formidCtrl.touched" class="p-error d-block mt-1">
          Campo requerido.
        </small>
      </div>

      <div class="col-12 col-md-6">
        <label class="rw-form-label">NOMBRE</label>
        <input class="form-control rw-input" type="text" placeholder="Nombre de la sucursal"
          [(ngModel)]="sucursal.nombre" name="nombre"
          [ngClass]="{'p-invalid': formNombreCtrl.invalid && formNombreCtrl.touched}" #formNombreCtrl="ngModel" required>
        <small *ngIf="formNombreCtrl.invalid && formNombreCtrl.touched" class="p-error d-block mt-1">
          Campo requerido.
        </small>
      </div>

      <div class="col-12 col-md-6">
        <label class="rw-form-label">ID FRONT</label>
        <input class="form-control rw-input" type="number" placeholder="Ingrese el ID de Front"
          [(ngModel)]="sucursal.idFront" name="idfront"
          [ngClass]="{'p-invalid': formIdfCtrl.invalid && formIdfCtrl.touched}" #formIdfCtrl="ngModel" required>
        <small *ngIf="formIdfCtrl.invalid && formIdfCtrl.touched" class="p-error d-block mt-1">
          Campo requerido.
        </small>
      </div>

      <div class="col-12 col-md-6">
        <label class="rw-form-label">CLA UBICACIÓN</label>
        <input class="form-control rw-input" type="number" placeholder="Ubicación en Fortia"
          [(ngModel)]="sucursal.claUbicacion" name="claubicacion">
      </div>

      <div class="col-12 col-md-6">
        <label class="rw-form-label">TABLETAS REQUERIDAS</label>
        <p-inputNumber [(ngModel)]="sucursal.tabletasRequeridas" name="tabletasRequeridas" mode="decimal"
          [showButtons]="true" buttonLayout="horizontal" incrementButtonIcon="pi pi-plus"
          decrementButtonIcon="pi pi-minus" [min]="0" [inputStyle]="{ width: '100%', height: '48px' }"
          class="contador-gris w-100 d-block"></p-inputNumber>
      </div>
      
      <div class="col-12 col-md-6">
        <label class="rw-form-label">CANTIDAD DE TABLETAS</label>
        <p-inputNumber [(ngModel)]="cantidadTabletas" (ngModelChange)="onTabletasChange($event)" name="cantidadTabletas"
          mode="decimal" [showButtons]="true" buttonLayout="horizontal" incrementButtonIcon="pi pi-plus"
          decrementButtonIcon="pi pi-minus" [min]="0" [inputStyle]="{ width: '100%', height: '48px' }"
          class="contador-gris w-100 d-block" [max]="sucursal.tabletasRequeridas">
        </p-inputNumber>
      </div>

      <div class="col-12 col-md-6">
        <label class="rw-form-label">PUNTOS DE VENTA REQUERIDOS</label>
        <p-inputNumber [(ngModel)]="sucursal.tpvsRequeridos" name="tpvsRequeridos" mode="decimal" [showButtons]="true"
          buttonLayout="horizontal" incrementButtonIcon="pi pi-plus" decrementButtonIcon="pi pi-minus" [min]="0"
          [inputStyle]="{ width: '100%', height: '48px' }" class="contador-gris w-100 d-block"></p-inputNumber>
      </div>

      <div class="col-12 col-md-6">
        <label class="rw-form-label">CANTIDAD DE PUNTOS DE VENTA</label>
        <p-inputNumber [(ngModel)]="cantidadTPVs" (ngModelChange)="onTPVsChange($event)" name="cantidadTPVs"
          mode="decimal" [showButtons]="true" buttonLayout="horizontal" incrementButtonIcon="pi pi-plus"
          decrementButtonIcon="pi pi-minus" [min]="0" [inputStyle]="{ width: '100%', height: '48px' }"
          class="contador-gris w-100 d-block" [max]="sucursal.tpvsRequeridos">
        </p-inputNumber>
      </div>

      <div class="col-12" *ngIf="usuario.idRol == '5' || usuario.idRol == '1'">
        <div class="d-flex align-items-center p-3 rounded" style="background-color: #f8fafc; border: 1px solid #e2e8f0;">
          <div class="form-check form-switch m-0 d-flex align-items-center gap-3">
            <input class="form-check-input m-0" type="checkbox" role="switch" id="flexSwitchCheckDefault"
              style="width: 3.5rem; height: 2rem; cursor: pointer;" name="activoMantenimientos" [checked]="esMantenimientoActivo(sucursal)"
              (change)="toggleMantenimiento(sucursal)">
            <label class="form-check-label rw-form-label m-0" for="flexSwitchCheckDefault" style="cursor: pointer; margin-bottom: 0 !important;">¿ACTIVAR MANTENIMIENTOS?</label>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-5 pt-3 border-top">
      <button type="submit" class="btn-rw-cta" [disabled]="form.invalid">
        <i class='bx bx-check-circle'></i>
        <span *ngIf="esNuevaSucursal">CREAR SUCURSAL</span>
        <span *ngIf="!esNuevaSucursal">GUARDAR CAMBIOS</span>
      </button>
    </div>

  </form>

</p-dialog>
