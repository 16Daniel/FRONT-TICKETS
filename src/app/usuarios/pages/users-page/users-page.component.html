<div class="users-page-wrapper">
  <div class="users-content-container">

    <!-- Encabezado de Página Reutilizable -->
    <app-page-header 
      subtitle="Gestión y Control" 
      title="Lista de Usuarios">
    </app-page-header>

    <!-- Barra Selector de Áreas por Chips -->
    <div class="areas-chips-track mb-4">
      <button 
        type="button" 
        class="chip-area-pill"
        [class.is-active]="areaSeleccionadaId === 'sucursales'"
        (click)="cambiarArea('sucursales')">
        <span class="area-dot"></span>
        <span class="area-name">SUCURSALES</span>
      </button>

      <button 
        *ngFor="let area of areas" 
        type="button" 
        class="chip-area-pill"
        [class.is-active]="String(area.id) === areaSeleccionadaId"
        (click)="cambiarArea(area.id)">
        <span class="area-dot"></span>
        <span class="area-name">{{ area.nombre }}</span>
      </button>
    </div>

    <!-- Barra de Herramientas y Filtros -->
    <div class="users-toolbar-bar mb-4">
      <div class="toolbar-left">
        <div class="search-input-wrapper">
          <i class="bx bx-search search-icon"></i>
          <input 
            type="text" 
            #filterInput
            (input)="dt.filterGlobal(filterInput.value, 'contains')"
            placeholder="Buscar usuario..." 
            class="users-search-input" />
        </div>
      </div>
      <div class="toolbar-right">
        <!-- Botón Agregar Usuario -->
        <button 
          type="button" 
          class="btn-rw-cta" 
          (click)="abrirModalCrearUsuario()">
          <i class="bx bx-plus"></i>
          <span>AGREGAR USUARIO</span>
        </button>
      </div>
    </div>

    <!-- Contenedor de la Tabla -->
    <div class="users-nodes-container">
      <p-table #dt [value]="usuariosFiltrados" [globalFilterFields]="['nombre', 'apellidoP', 'apellidoM', 'email']" [tableStyle]="{ 'min-width': '10rem' }"
          styleClass="p-datatable-gridlines table-tk">
          <ng-template pTemplate="header">
              <tr>
                  <th>NOMBRE</th>
                  <th>CORREO</th>
                  <th>ROL</th>
                  <th style="width: 120px; text-align: center;">ACCIONES</th>
              </tr>
          </ng-template>
          <ng-template pTemplate="body" let-usuario>
              <tr [pSelectableRow]="usuario">
                  <td>{{usuario.nombre}} {{usuario.apellidoP}} {{usuario.apellidoM}}</td>
                  <td>{{usuario.email}}</td>
                  <td>{{obtenerNombreRol(usuario.idRol)}}</td>
                  <td>
                      <div class="d-flex justify-content-start align-items-center gap-2">
                          <button class="btn-action-table btn-action-info" (click)="abrirModalEditarUsuario(usuario)"
                              pTooltip="EDITAR" tooltipPosition="top">
                              <i class="bx bx-edit"></i>
                          </button>
                          <button class="btn-action-table btn-action-danger" (click)="confirmaEliminacion(usuario.id)"
                              pTooltip="ELIMINAR" tooltipPosition="top">
                              <i class="bx bx-trash"></i>
                          </button>
                      </div>
                  </td>
              </tr>
          </ng-template>
      </p-table>
    </div>

  </div>
</div>







<p-toast [breakpoints]="{'920px': {width: '100%', right: '0', left: '0'}}" [showTransformOptions]="'translateY(100%)'"
    [showTransitionOptions]="'500ms'" [hideTransitionOptions]="'500ms'"
    [showTransformOptions]="'translateX(100%)'"></p-toast>
<p-confirmDialog>
    <ng-template pTemplate="message" let-message>
        <div class="flex flex-column align-items-center w-full gap-3 border-bottom-1 surface-border">
            <i class="pi pi-exclamation-circle text-6xl text-primary-500"></i>
            <p>{{ message.message }}</p>
        </div>
    </ng-template>
</p-confirmDialog>

<app-crear-usuario-dialog *ngIf="mostrarModalUsuario" [mostrarModalCrearUsuario]="mostrarModalUsuario"
    (closeEvent)="cerrarModalUsuario()" [usuario]="usuarioSeleccionado" [esNuevoUsuario]="esNuevoUsuario"></app-crear-usuario-dialog>
