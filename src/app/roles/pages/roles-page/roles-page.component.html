<div class="roles-page-wrapper">
  <div class="roles-content-container">

    <!-- Encabezado de Página Reutilizable -->
    <app-page-header 
      subtitle="Gestión de Roles" 
      title="Catálogo de Roles de Usuario">
    </app-page-header>

    <!-- Barra de Herramientas y Filtros -->
    <div class="roles-toolbar-bar mb-4">
      <div class="toolbar-left">
        <div class="search-input-wrapper">
          <i class="bx bx-search search-icon"></i>
          <input 
            type="text" 
            #filterInput
            (input)="dt.filterGlobal(filterInput.value, 'contains')"
            placeholder="Buscar rol..." 
            class="roles-search-input" />
        </div>
      </div>

      <div class="toolbar-right">
        <!-- Botón Nuevo Rol -->
        <button 
          type="button" 
          class="btn-rw-cta" 
          (click)="showAgregar()">
          <i class="bx bx-plus"></i>
          <span>NUEVO ROL</span>
        </button>
      </div>
    </div>

    <!-- Contenedor Principal (Tabla) -->
    <div class="roles-nodes-container">
      <p-table #dt 
        [value]="catroles" 
        [loading]="loading"
        [globalFilterFields]="['nombre', 'id']" 
        [tableStyle]="{ 'min-width': '10rem' }"
        styleClass="p-datatable-gridlines table-tk">
        
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 140px; text-align: center;">ID</th>
            <th>NOMBRE DEL ROL</th>
            <th style="width: 140px; text-align: center;">ACCIONES</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-rol>
          <tr [pSelectableRow]="rol">
            <td style="text-align: center;">
              <span class="badge bg-light text-dark border px-2 py-1">
                {{ rol.id }}
              </span>
            </td>
            <td>
              <span class="fw-bold text-dark">{{ rol.nombre }}</span>
            </td>
            <td>
              <div class="d-flex justify-content-center align-items-center gap-2">
                <button class="btn-action-table btn-action-info" (click)="showEdit(rol)"
                  pTooltip="EDITAR" tooltipPosition="top">
                  <i class="bx bx-edit"></i>
                </button>
                <button class="btn-action-table btn-action-danger" (click)="confirm(rol.id)"
                  pTooltip="ELIMINAR" tooltipPosition="top">
                  <i class="bx bx-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="3" class="text-center py-4 text-muted">
              No se encontraron roles registrados.
            </td>
          </tr>
        </ng-template>

      </p-table>
    </div>

  </div>
</div>

<!-- Modal Crear / Actualizar Rol -->
<p-dialog 
  [header]="actualizar ? 'ACTUALIZAR ROL' : 'CREAR ROL'" 
  [(visible)]="modalAgregar" 
  [modal]="true" 
  [style]="{ width: '42rem', maxWidth: '95vw' }" 
  [draggable]="false" 
  [resizable]="false"
  (onHide)="cerrarModal()">
  
  <form #formRol="ngForm" (ngSubmit)="guardar()" class="mt-3">
    <div class="row gy-3">
      <div class="col-12" *ngIf="actualizar">
        <label class="rw-form-label">ID DEL ROL</label>
        <input 
          class="form-control rw-input w-100" 
          type="text" 
          [disabled]="true" 
          [value]="rolsel?.id">
      </div>

      <div class="col-12">
        <label class="rw-form-label">NOMBRE DEL ROL</label>
        <input 
          class="form-control rw-input w-100" 
          type="text" 
          placeholder="Ej: SUPERVISOR DE OPERACIONES" 
          [(ngModel)]="formdescripcion" 
          name="nombreRol"
          required 
          #nombreCtrl="ngModel"
          [ngClass]="{'is-invalid': nombreCtrl.invalid && nombreCtrl.touched}">
        <small *ngIf="nombreCtrl.invalid && nombreCtrl.touched" class="text-danger d-block mt-1">
          El nombre del rol es obligatorio.
        </small>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-4 pt-3 border-top gap-2">
      <button type="button" class="btn btn-light px-3 py-2" (click)="cerrarModal()">
        CANCELAR
      </button>
      <button type="submit" class="btn-rw-cta" [disabled]="formRol.invalid || guardando">
        <i class="bx bx-save"></i>
        <span>{{ actualizar ? 'ACTUALIZAR ROL' : 'GUARDAR ROL' }}</span>
      </button>
    </div>
  </form>

</p-dialog>

<!-- Toast & Confirm Dialog -->
<p-toast 
  [breakpoints]="{'920px': {width: '100%', right: '0', left: '0'}}" 
  [showTransformOptions]="'translateY(100%)'" 
  [showTransitionOptions]="'500ms'" 
  [hideTransitionOptions]="'500ms'" 
  [showTransformOptions]="'translateX(100%)'">
</p-toast>

<p-confirmDialog>
  <ng-template pTemplate="message" let-message>
    <div class="flex flex-column align-items-center w-full gap-3 border-bottom-1 surface-border">
      <i class="pi pi-exclamation-circle text-6xl text-primary-500"></i>
      <p>{{ message.message }}</p>
    </div>
  </ng-template>
</p-confirmDialog>
