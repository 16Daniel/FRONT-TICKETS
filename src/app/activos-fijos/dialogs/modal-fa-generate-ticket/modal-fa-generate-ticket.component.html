<p-dialog 
  header="GENERAR TICKET DESDE ACTIVO FIJO" 
  [modal]="true" 
  [(visible)]="mostrarModalGenerateTicket" 
  [style]="{ width: '52rem' }"
  [breakpoints]="{ '1199px': '80vw', '575px': '95vw' }" 
  [maximizable]="true" 
  (onHide)="onHide()"
  styleClass="modal-ticket-rw">

  <form #form="ngForm" (ngSubmit)="enviarTicket(form)" class="formulario-ticket">

    <!-- Tarjeta Informativa del Activo Fijo -->
    <div class="tarjeta-activo-destacada">
      <div class="activo-icono-wrap">
        <i class="bx bx-barcode"></i>
      </div>
      <div class="activo-info-texto">
        <span class="activo-referencia">Activo Fijo: {{ activoFijo.referencia }}</span>
        <span class="activo-descripcion">{{ activoFijo.descripcion }}</span>
      </div>
    </div>

    <!-- Fila 1: Sucursal y Área (Bloqueadas/Preseleccionadas) -->
    <div class="grid-dos-columnas">
      <div class="campo-grupo">
        <label class="etiqueta-formulario">
          <i class="bx bx-store-alt"></i> Sucursal / Departamento
        </label>
        <p-dropdown 
          [options]="sucursales" 
          [(ngModel)]="ticket.idSucursal" 
          name="sucursal" 
          [optionValue]="'id'"
          optionLabel="nombre" 
          [disabled]="true"
          placeholder="Sucursal" 
          [style]="{width:'100%'}">
        </p-dropdown>
      </div>

      <div class="campo-grupo">
        <label class="etiqueta-formulario">
          <i class="bx bx-layer"></i> Área Asignada
        </label>
        <p-dropdown 
          [options]="areas" 
          [(ngModel)]="ticket.idArea" 
          [optionValue]="'id'" 
          name="area" 
          optionLabel="nombre"
          [disabled]="true" 
          placeholder="Área" 
          [style]="{width:'100%'}">
        </p-dropdown>
      </div>
    </div>

    <!-- Fila 2: Selector Interactivo de Árbol de Categorías -->
    <div class="seccion-bloque-arbol">
      <app-selector-arbol-categoria
        [idArea]="ticket.idArea"
        (alSeleccionar)="onSeleccionarCategoria($event)"
        (alLimpiar)="onLimpiarCategoria()">
      </app-selector-arbol-categoria>
    </div>

    <!-- Fila 3: Solicitante -->
    <div class="campo-grupo">
      <label class="etiqueta-formulario">
        <i class="bx bx-user"></i> Nombre del Solicitante
      </label>
      <input 
        class="input-texto-rw" 
        type="text" 
        placeholder="Nombre de quien reporta la falla..."
        [(ngModel)]="ticket.solicitante" 
        name="nombreSolicitante"
        [ngClass]="{'input-invalido': formNombreSolicitanteCtrl.invalid && formNombreSolicitanteCtrl.touched}"
        #formNombreSolicitanteCtrl="ngModel" 
        required>
      <small *ngIf="formNombreSolicitanteCtrl.invalid && formNombreSolicitanteCtrl.touched" class="p-error">
        El nombre del solicitante es requerido.
      </small>
    </div>

    <!-- Fila 4: Evidencias Fotográficas -->
    <div class="seccion-evidencias">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
        <label class="etiqueta-formulario m-0">
          <i class="bx bx-image-add"></i> Evidencia Fotográfica del Activo
        </label>
        <input type="file" id="fileInputFA" (change)="onFileChange($event)" multiple accept="image/*" hidden />
        <button type="button" (click)="onSeleccionarImagenes()" class="btn-adjuntar-evidencia">
          <i class="bx bx-upload"></i> Subir imágenes
        </button>
      </div>

      <div *ngIf="imagenesBase64.length > 0" class="galeria-miniaturas">
        <div *ngFor="let img of imagenesBase64; let i = index" class="miniatura-item">
          <img [src]="img" [alt]="'Evidencia ' + (i + 1)" />
          <span class="miniatura-pie">Foto {{ i + 1 }}</span>
        </div>
      </div>
    </div>

    <!-- Fila 5: Descripción del Problema -->
    <div class="campo-grupo">
      <label class="etiqueta-formulario">
        <i class="bx bx-detail"></i> Detalle de la Falla o Problema
      </label>
      <textarea 
        [(ngModel)]="ticket.descripcion" 
        name="descripcion" 
        rows="4" 
        class="textarea-rw"
        placeholder="Describe qué le ocurre al activo fijo, síntomas, ruidos, mensajes de error..."
        [ngClass]="{'input-invalido': formDescripcionCtrl.invalid && formDescripcionCtrl.touched}"
        #formDescripcionCtrl="ngModel" 
        required>
      </textarea>
      <small *ngIf="formDescripcionCtrl.invalid && formDescripcionCtrl.touched" class="p-error">
        La descripción es requerida.
      </small>
    </div>

    <!-- Barra de Acciones Modal -->
    <div class="barra-acciones-modal">
      <button type="button" class="btn-cancelar-modal" (click)="onHide()">
        Cancelar
      </button>
      <button type="submit" class="btn-rw-cta">
        <i class="bx bx-send"></i>
        <span>CREAR TICKET PARA ESTE ACTIVO</span>
      </button>
    </div>

  </form>
</p-dialog>
