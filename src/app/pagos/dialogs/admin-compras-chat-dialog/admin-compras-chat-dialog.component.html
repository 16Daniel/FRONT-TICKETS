<p-dialog
  [modal]="true"
  [(visible)]="showModalChatCompra"
  [style]="{ width: '46rem', maxWidth: '92vw' }"
  [breakpoints]="{ '1199px': '75vw', '575px': '100vw' }"
  [maximizable]="true"
  [draggable]="false"
  (onHide)="onHide()"
  styleClass="dialog-rw-chat">

  <ng-template pTemplate="header">
    <div class="d-flex align-items-center gap-2">
      <i class="bx bx-conversation text-danger fs-4"></i>
      <span class="p-dialog-title">Chat de Solicitud</span>
    </div>
  </ng-template>

  <div class="chat-viewport" *ngIf="ticket != undefined" #chatContainer>
    <div *ngIf="!ticket.comentarios || ticket.comentarios.length === 0" class="chat-empty-state">
      <div class="empty-icon-circle">
        <i class="bx bx-conversation"></i>
      </div>
      <p class="empty-title">Sin mensajes aún</p>
      <p class="empty-subtitle">Inicia la conversación sobre esta solicitud con tu equipo.</p>
    </div>

    <div class="chat-messages-list" *ngIf="ticket.comentarios?.length">
      <div
        class="message-row"
        *ngFor="let item of ticket.comentarios"
        [ngClass]="esmiId(item.idUsuario) ? 'row-me' : 'row-other'">

        <div class="chat-bubble" [ngClass]="esmiId(item.idUsuario) ? 'bubble-me' : 'bubble-other'">
          <span class="sender-name" *ngIf="!esmiId(item.idUsuario)">
            {{ item.nombre }}
          </span>

          <div class="message-content" [innerHTML]="item.comentario"></div>

          <span class="message-time">
            {{ datesHelper.getDate(item.fecha) | date: 'dd/MM hh:mm a' }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="chat-input-bar">
      <input
        type="text"
        class="chat-text-input"
        placeholder="Escribe un mensaje..."
        [(ngModel)]="comentario"
        (keyup.enter)="enviarComentarioChat()" />

      <button
        type="button"
        class="btn-send-message"
        (click)="enviarComentarioChat()"
        [disabled]="!comentario || !comentario.trim()"
        title="Enviar mensaje">
        <i class="bx bxs-send"></i>
      </button>
    </div>
  </ng-template>
</p-dialog>
