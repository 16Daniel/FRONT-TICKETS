<div class="rw-chart-card mb-4">
  <div class="row g-3" *ngIf="usuario.id != idAdmin">
    <div class="col-12" style="height: 220px;">
      <ngx-charts-advanced-pie-chart
        [scheme]="colorScheme"
        [results]="single"
        [gradient]="gradient">
      </ngx-charts-advanced-pie-chart>
    </div>
  </div>

  <div class="row g-3" *ngIf="usuario.id == idAdmin">
    <div class="col-12 col-lg-6" style="height: 270px;">
      <p class="rw-chart-title">CLIENTE</p>
      <ngx-charts-advanced-pie-chart
        [scheme]="colorScheme"
        [results]="single"
        [gradient]="gradient">
      </ngx-charts-advanced-pie-chart>
    </div>
    <div class="col-12 col-lg-6" style="height: 270px;">
      <p class="rw-chart-title">PROVEEDOR</p>
      <ngx-charts-advanced-pie-chart
        [scheme]="colorScheme"
        [results]="gproveedor"
        [gradient]="gradient">
      </ngx-charts-advanced-pie-chart>
    </div>
  </div>
</div>
