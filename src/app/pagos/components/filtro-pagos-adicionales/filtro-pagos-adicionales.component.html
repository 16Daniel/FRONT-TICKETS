<div class="rw-filter-card mb-4">
  <div class="rw-filter-item rw-filter-full-mobile">
    <p>FECHA INICIO</p>
    <p-calendar
      [(ngModel)]="filtroFechaIni"
      [iconDisplay]="'input'"
      [showIcon]="true"
      inputId="icondisplayIni"
      dateFormat="dd/mm/yy"
      [style]="{ width: '100%' }"
      [showButtonBar]="true"
      [touchUI]="true" />
  </div>

  <div class="rw-filter-item rw-filter-full-mobile">
    <p>FECHA FIN</p>
    <p-calendar
      [(ngModel)]="filtroFechaFin"
      [iconDisplay]="'input'"
      [showIcon]="true"
      inputId="icondisplayFin"
      dateFormat="dd/mm/yy"
      [style]="{ width: '100%' }"
      [showButtonBar]="true"
      [touchUI]="true" />
  </div>

  <div class="rw-filter-item rw-filter-full-mobile">
    <p>ESTATUS</p>
    <select class="form-select h-42" [(ngModel)]="filtroEstatus">
      <option value="">TODO</option>
      <option value="0">CANCELADO</option>
      <option value="1">POR PAGAR</option>
      <option value="2">PAGADO</option>
    </select>
  </div>

  <div class="rw-filter-item rw-filter-full-mobile">
    <p>SOLICITANTE</p>
    <input type="text" class="form-control h-42" placeholder="Buscar solicitante..." [(ngModel)]="filtroSolicitante" (ngModelChange)="filtrarSolicitante()">
  </div>

  <div class="rw-filter-item rw-filter-full-mobile">
    <p>BENEFICIARIO</p>
    <input type="text" class="form-control h-42" placeholder="Buscar beneficiario..." [(ngModel)]="filtroBeneficiario" (ngModelChange)="filtrarBeneficiario()">
  </div>

  <div class="rw-filter-btn-wrap">
    <button type="button" class="btn btn-warning rw-filter-btn" (click)="filtrar()">
      <i class='bx bx-search'></i><span>BUSCAR</span>
    </button>
  </div>

  <div class="rw-filter-btn-wrap">
    <button type="button" class="btn btn-success rw-filter-btn" [disabled]="dataPagos.length == 0" (click)="exportToExcel(dataPagos)">
      <img width="20" height="20" src="https://img.icons8.com/fluency/40/microsoft-excel-2019.png" alt="excel"/><span>EXCEL</span>
    </button>
  </div>
</div>
