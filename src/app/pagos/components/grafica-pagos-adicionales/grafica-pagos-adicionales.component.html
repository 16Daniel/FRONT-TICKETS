<div class="rw-chart-card mb-4">
  <div class="row g-3 m-0">
    <div class="col-12 col-md-6" style="height: 250px;">
      <p class="rw-chart-title text-center">SOLICITANTES</p>
      <ngx-charts-advanced-pie-chart
        [scheme]="colorScheme"
        [results]="single"
        [gradient]="gradient">
      </ngx-charts-advanced-pie-chart>
    </div>
    <div class="col-12 col-md-6" style="height: 250px;">
      <p class="rw-chart-title text-center">BENEFICIARIOS</p>
      <ngx-charts-advanced-pie-chart
        [scheme]="colorScheme"
        [results]="single2"
        [gradient]="gradient">
      </ngx-charts-advanced-pie-chart>
    </div>
  </div>
</div>
