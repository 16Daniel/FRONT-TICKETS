<div class="areas-page-wrapper">
  <div class="areas-content-container">

    <!-- Encabezado de Página Reutilizable -->
    <app-page-header 
      subtitle="Gestión de Áreas" 
      title="Catálogo de Áreas Operativas">
    </app-page-header>

    <!-- Barra de Herramientas y Filtros -->
    <div class="areas-toolbar-bar mb-4">
      <div class="toolbar-left">
        <div class="search-input-wrapper">
          <i class="bx bx-search search-icon"></i>
          <input 
            type="text" 
            #filterInput
            (input)="dt.filterGlobal(filterInput.value, 'contains')"
            placeholder="Buscar área..." 
            class="areas-search-input" />
        </div>
      </div>

      <div class="toolbar-right">
        <!-- Botón Nueva Área -->
        <button 
          type="button" 
          class="btn-rw-cta" 
          (click)="abrirModalCrearArea()">
          <i class="bx bx-plus"></i>
          <span>NUEVA ÁREA</span>
        </button>
      </div>
    </div>

    <!-- Contenedor Principal (Tabla) -->
    <div class="areas-nodes-container">
      <p-table #dt [value]="(areasService.areas$ | async) ?? []" [globalFilterFields]="['nombre']" [tableStyle]="{ 'min-width': '10rem' }"
          styleClass="p-datatable-gridlines table-tk">
          <ng-template pTemplate="header">
              <tr>
                  <th>ID</th>
                  <th>NOMBRE</th>
                  <th style="text-align: center;">MÓDULO TICKETS</th>
                  <th style="width: 120px; text-align: center;">ACCIONES</th>
              </tr>
          </ng-template>
          <ng-template pTemplate="body" let-area>
              <tr [pSelectableRow]="area">
                  <td>{{ area.id }}</td>
                  <td>{{ area.nombre }}</td>
                  <td style="text-align: center;">
                      <span class="badge" [ngClass]="area.activarTickets ? 'bg-success' : 'bg-secondary'">
                        {{ area.activarTickets ? 'ACTIVO' : 'INACTIVO' }}
                      </span>
                  </td>
                  <td>
                      <div class="d-flex justify-content-start align-items-center gap-2" style="justify-content: center !important;">
                          <button class="btn-action-table btn-action-info" (click)="abrirModalEditarArea(area)"
                              pTooltip="EDITAR" tooltipPosition="top">
                              <i class="bx bx-edit"></i>
                          </button>
                          <button class="btn-action-table btn-action-danger" (click)="confirmaEliminacion(area.id)"
                              pTooltip="ELIMINAR" tooltipPosition="top">
                              <i class="bx bx-trash"></i>
                          </button>
                      </div>
                  </td>
              </tr>
          </ng-template>
      </p-table>
    </div>
  </div>
</div>

<p-toast [breakpoints]="{'920px': {width: '100%', right: '0', left: '0'}}" [showTransformOptions]="'translateY(100%)'"
    [showTransitionOptions]="'500ms'" [hideTransitionOptions]="'500ms'"
    [showTransformOptions]="'translateX(100%)'"></p-toast>
<p-confirmDialog>
    <ng-template pTemplate="message" let-message>
        <div class="flex flex-column align-items-center w-full gap-3 border-bottom-1 surface-border">
            <i class="pi pi-exclamation-circle text-6xl text-primary-500"></i>
            <p>{{ message.message }}</p>
        </div>
    </ng-template>
</p-confirmDialog>

<app-modal-area-create *ngIf="mostrarModalArea" [mostrarModalCrearArea]="mostrarModalArea"
    (closeEvent)="cerrarModalArea()" [area]="areaSeleccionada" [esNuevaArea]="esNuevaArea"></app-modal-area-create>
