<p-dialog 
  header="GENERAR TICKET" 
  [modal]="true" 
  [(visible)]="mostrarModalGenerateTicket" 
  [style]="{ width: '52rem' }"
  [breakpoints]="{ '1199px': '80vw', '575px': '95vw' }" 
  [maximizable]="true" 
  (onHide)="onHide()"
  styleClass="modal-ticket-rw">

  <form #form="ngForm" (ngSubmit)="enviarTicket(form)" class="formulario-ticket">

    <!-- Fila 1: Sucursal y Área -->
    <div class="grid-dos-columnas">
      <div class="campo-grupo">
        <label class="etiqueta-formulario">
          <i class="bx bx-store-alt"></i> Sucursal / Departamento
        </label>
        <p-dropdown 
          [options]="sucursales" 
          [(ngModel)]="ticket.idSucursal" 
          name="sucursal" 
          [optionValue]="'id'"
          optionLabel="nombre" 
          [filter]="true" 
          filterBy="nombre" 
          [showClear]="true"
          placeholder="Seleccionar sucursal..." 
          [style]="{width:'100%'}"
          [disabled]="usuarioActivo.idRol == '2' || usuarioActivo.idRol == '3'">
          <ng-template pTemplate="selectedItem" let-selectedOption>
            <div class="flex align-items-center gap-2">
              <div>{{ selectedOption.nombre }}</div>
            </div>
          </ng-template>
          <ng-template let-dep pTemplate="item">
            <div class="flex align-items-center gap-2">
              <div>{{ dep.nombre }}</div>
            </div>
          </ng-template>
        </p-dropdown>
      </div>

      <div class="campo-grupo">
        <label class="etiqueta-formulario">
          <i class="bx bx-layer"></i> Área de Destino
        </label>
        <p-dropdown 
          [options]="areas" 
          [(ngModel)]="ticket.idArea" 
          [optionValue]="'id'" 
          name="area" 
          optionLabel="nombre"
          [filter]="true" 
          filterBy="nombre" 
          [disabled]="idArea != '0'" 
          [showClear]="false"
          placeholder="Seleccionar área..." 
          [style]="{width:'100%'}" 
          (onChange)="onChangeArea()" 
          #formAreaCtrl="ngModel"
          [ngClass]="{'p-invalid': formAreaCtrl.invalid && formAreaCtrl.touched}" 
          required>
          <ng-template pTemplate="selectedItem" let-selectedOption>
            <div class="flex align-items-center gap-2">
              <div>{{ selectedOption.nombre }}</div>
            </div>
          </ng-template>
          <ng-template let-dep pTemplate="item">
            <div class="flex align-items-center gap-2">
              <div>{{ dep.nombre }}</div>
            </div>
          </ng-template>
        </p-dropdown>
        <small *ngIf="formAreaCtrl.invalid && formAreaCtrl.touched" class="p-error">El área es requerida.</small>
      </div>
    </div>

    <!-- Fila 2: Selector Interactivo de Árbol de Categorías -->
    <div class="seccion-bloque-arbol">
      <app-selector-arbol-categoria
        [idArea]="ticket.idArea"
        (alSeleccionar)="onSeleccionarCategoria($event)"
        (alLimpiar)="onLimpiarCategoria()">
      </app-selector-arbol-categoria>
    </div>

    <!-- Fila 3: Solicitante -->
    <div class="campo-grupo">
      <label class="etiqueta-formulario">
        <i class="bx bx-user"></i> Nombre del Solicitante
      </label>
      <input 
        class="input-texto-rw" 
        type="text" 
        placeholder="Nombre de quien solicita..."
        [(ngModel)]="ticket.solicitante" 
        name="nombreSolicitante"
        [ngClass]="{'input-invalido': formNombreSolicitanteCtrl.invalid && formNombreSolicitanteCtrl.touched}"
        #formNombreSolicitanteCtrl="ngModel" 
        required>
      <small *ngIf="formNombreSolicitanteCtrl.invalid && formNombreSolicitanteCtrl.touched" class="p-error">
        El nombre del solicitante es requerido.
      </small>
    </div>

    <!-- Fila 4: Vinculación de Activo Fijo (Opcional) -->
    <div class="tarjeta-activo-fijo">
      <div class="switch-activo-wrap">
        <div class="form-check form-switch d-flex align-items-center gap-2 m-0">
          <input 
            class="form-check-input switch-rw" 
            type="checkbox" 
            role="switch" 
            id="switchActivoFijo"
            name="ligarActivo" 
            [(ngModel)]="esActivoFijo">
          <label class="form-check-label fw-bold text-dark" for="switchActivoFijo">
            ¿Ligar a un Activo Fijo?
          </label>
        </div>
      </div>

      <div class="campo-activo-detalle" *ngIf="esActivoFijo">
        <div class="d-flex align-items-center gap-2">
          <input 
            class="input-texto-rw flex-grow-1" 
            type="text" 
            placeholder="Escribe el código o referencia del activo..."
            [(ngModel)]="ticket.referenciaActivoFijo" 
            name="referenciaActivoFijo"
            [ngClass]="{'input-invalido': formReferenciaActivoFijoCtrl.invalid && formReferenciaActivoFijoCtrl.touched}"
            #formReferenciaActivoFijoCtrl="ngModel" 
            required 
            (change)="buscarActivoFijo()">
          <button type="button" class="btn-buscar-activo" (click)="buscarActivoFijo()">
            <i class="bx bx-search"></i> Buscar
          </button>
        </div>
        <small *ngIf="formReferenciaActivoFijoCtrl.invalid && formReferenciaActivoFijoCtrl.touched" class="p-error">
          Ingresa la referencia del activo fijo.
        </small>
        <div class="info-activo-encontrado" *ngIf="activoFijo">
          <i class="bx bx-check-circle text-success"></i>
          <span><b>Activo:</b> {{ activoFijo.descripcion }}</span>
        </div>
      </div>
    </div>

    <!-- Fila 5: Evidencias Fotográficas -->
    <div class="seccion-evidencias">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
        <label class="etiqueta-formulario m-0">
          <i class="bx bx-image-add"></i> Evidencia Fotográfica (Opcional)
        </label>
        <input type="file" id="fileInput" (change)="onFileChange($event)" multiple accept="image/*" hidden />
        <button type="button" (click)="onSeleccionarImagenes()" class="btn-adjuntar-evidencia">
          <i class="bx bx-upload"></i> Subir imágenes
        </button>
      </div>

      <div *ngIf="imagenesBase64.length > 0" class="galeria-miniaturas">
        <div *ngFor="let img of imagenesBase64; let i = index" class="miniatura-item">
          <img [src]="img" [alt]="'Evidencia ' + (i + 1)" />
          <span class="miniatura-pie">Foto {{ i + 1 }}</span>
        </div>
      </div>
    </div>

    <!-- Fila 6: Descripción del Problema -->
    <div class="campo-grupo">
      <label class="etiqueta-formulario">
        <i class="bx bx-detail"></i> Descripción del Problema
      </label>
      <textarea 
        [(ngModel)]="ticket.descripcion" 
        name="descripcion" 
        rows="4" 
        class="textarea-rw"
        placeholder="Describe detalladamente el problema o requerimiento..."
        [ngClass]="{'input-invalido': formDescripcionCtrl.invalid && formDescripcionCtrl.touched}"
        #formDescripcionCtrl="ngModel" 
        required>
      </textarea>
      <small *ngIf="formDescripcionCtrl.invalid && formDescripcionCtrl.touched" class="p-error">
        La descripción es requerida.
      </small>
    </div>

    <!-- Botones de Acción -->
    <div class="barra-acciones-modal">
      <button type="button" class="btn-cancelar-modal" (click)="onHide()">
        Cancelar
      </button>
      <button type="submit" class="btn-rw-cta">
        <i class="bx bx-send"></i>
        <span>CREAR TICKET</span>
      </button>
    </div>

  </form>
</p-dialog>
