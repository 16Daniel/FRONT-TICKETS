<p-dialog 
  [(visible)]="mostrarModalSubcrearCategoria" 
  [modal]="true" 
  [style]="{ width: '520px', maxWidth: '95vw' }" 
  [draggable]="false"
  [resizable]="false"
  styleClass="rw-modern-dialog"
  (onHide)="onHide()">

  <ng-template pTemplate="header">
    <div class="dialog-header-title">
      <div class="dialog-header-icon" [class.is-edit]="!esNuevaSubcategoria">
        <i class="bx" [ngClass]="!esNuevaSubcategoria ? 'bx-edit-alt' : 'bx-git-repo-forked'"></i>
      </div>
      <div class="dialog-header-texts">
        <h4>{{ !esNuevaSubcategoria ? 'ACTUALIZAR SUBCATEGORÍA' : 'NUEVA SUBCATEGORÍA' }}</h4>
        <span>Asigna un nombre descriptivo para esta subcategoría</span>
      </div>
    </div>
  </ng-template>

  <form #form="ngForm" (ngSubmit)="enviar(form)" class="dialog-form-content">
    <div class="form-group-item mt-1">
      <label class="form-label-custom">NOMBRE DE LA SUBCATEGORÍA <span class="required-star">*</span></label>
      <div class="input-container">
        <i class="bx bx-subdirectory-right input-lead-icon"></i>
        <input 
          class="form-control-custom" 
          type="text" 
          placeholder="Escribe el nombre de la subcategoría..."
          [(ngModel)]="subcategoria.nombre" 
          name="subcategoria"
          [ngClass]="{'is-invalid-input': formSubcategoriaCtrl.invalid && formSubcategoriaCtrl.touched}"
          #formSubcategoriaCtrl="ngModel" 
          required>
      </div>
      <small *ngIf="formSubcategoriaCtrl.invalid && formSubcategoriaCtrl.touched" class="field-error-msg">
        <i class="bx bx-error-circle"></i> El nombre de la subcategoría es requerido.
      </small>
    </div>

    <!-- Modal Footer Actions -->
    <div class="dialog-actions-footer mt-4">
      <button 
        type="button" 
        class="btn-dialog-cancel" 
        (click)="onHide()">
        Cancelar
      </button>

      <button 
        type="submit" 
        class="btn-rw-cta">
        <i class='bx' [ngClass]="esNuevaSubcategoria ? 'bx-check' : 'bx-save'"></i>
        <span>{{ esNuevaSubcategoria ? 'AGREGAR SUBCATEGORÍA' : 'ACTUALIZAR' }}</span>
      </button>
    </div>
  </form>

</p-dialog>
