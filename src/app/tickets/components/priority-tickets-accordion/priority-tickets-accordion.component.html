<app-tpvs-devices-table *ngIf="mostrarTpvs" [sucursal]="sucursal"></app-tpvs-devices-table>

<p-accordion class="custom-branches-accordion w-full" *ngIf="!mostrarTpvs">
    <p-accordionTab *ngFor="let item of ['Crítico', 'Alto', 'Medio', 'Bajo']">
        <ng-template pTemplate="header">
            <div class="branch-accordion-header" [ngClass]="obtenerClaseEstadoPrioridad(item)">
                
                <div class="branch-info-group">
                    <!-- Clean Number Badge ONLY -->
                    <div class="branch-count-badge">
                        {{ obtenerContadorTickets(item) }}
                    </div>

                    <!-- Priority Name ONLY -->
                    <span class="branch-title">PRIORIDAD {{ item | uppercase }}</span>
                </div>

                <!-- Action / Alert Badges -->
                <div class="branch-actions-indicators">
                    <span class="indicator-badge badge-chat" *ngIf="verificarChatNoLeido(obtenerTicketsFiltrados(item))"
                        pTooltip="NUEVO CHAT" tooltipPosition="top">
                        <i class="bx bx-message-square-dots"></i>
                    </span>

                    <span class="indicator-badge badge-pending" *ngIf="verificarTicketsPorValidar(obtenerTicketsFiltrados(item))"
                        pTooltip="TICKET LISTO" tooltipPosition="top">
                        <i class="bx bx-check-double"></i>
                    </span>
                </div>
            </div>
        </ng-template>

        <app-requester-tickets-list [tickets]="obtenerTicketsFiltrados(item)"
            (clickEvent)="abrirModalDetalleTicket($event)" [mostrarEstrellas]="false" [mostrarAccionValidar]="false"
            [esEspectadorActivo]="esEspectadorActivo"></app-requester-tickets-list>
    </p-accordionTab>
</p-accordion>
