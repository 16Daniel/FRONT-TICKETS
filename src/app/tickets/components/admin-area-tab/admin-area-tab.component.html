<div class="tickets-tab-container">

  <!-- Dashboard KPI Cards Row (Floating directly on canvas) -->
  <div class="dashboard-unified-kpi-row mb-3">
    <div class="kpi-operational-col">
      <app-iconos-notificaciones-tickets 
        [tickets]="tickets" 
        [usuario]="usergroup"
        [compras]="compras">
      </app-iconos-notificaciones-tickets>
    </div>
    <div class="kpi-sla-col">
      <app-tarjeta-rendimiento-sla
        [totales]="totalesSla"
        [loading]="loadingSla"
        [mesNombre]="mesActualNombre"
        [titulo]="tituloSla">
      </app-tarjeta-rendimiento-sla>
    </div>
  </div>

  <!-- Action Buttons Toolbar Row (Floating directly on canvas) -->
  <div class="actions-toolbar-row mb-4">
    <div class="actions-buttons-container">
      <p-button 
        class="btn-crear-wrap"
        label="CREAR TICKET" 
        icon="pi pi-plus" 
        styleClass="p-button-primary action-btn-custom"
        (click)="mostrarModalGenerateTicket = true">
      </p-button>

      <p-button 
        class="btn-tool-wrap"
        (onClick)="opg.toggle($event)" 
        icon="pi pi-users" 
        label="AGRUPAR" 
        styleClass="p-button-danger action-btn-custom btn-icon-mobile">
      </p-button>

      <p-button 
        class="btn-tool-wrap"
        (onClick)="opf.toggle($event)" 
        icon="pi pi-filter" 
        label="FILTROS" 
        styleClass="p-button-danger action-btn-custom btn-icon-mobile">
      </p-button>

      <!-- <p-button 
        label="COMPRAS" 
        icon="pi pi-shopping-cart" 
        styleClass="btn-compras action-btn-custom" 
        (click)="mostrarModalCompras = true">
      </p-button>

      <p-button 
        label="SOLICITAR COMPRA" 
        icon="pi pi-plus" 
        styleClass="p-button-secondary action-btn-custom"
        (click)="mostrarModalSolicitarCompra = true">
      </p-button> -->
    </div>
  </div>

  <!-- Overlay Panel for Agrupar -->
  <p-overlayPanel #opg>
    <div class="d-flex flex-column justify-content-center p-3 gap-2">
      <button class="btn p-2 btn-light" (click)="agruparPorSucursal()">
        <i class="bx bx-buildings"></i>&nbsp;VER TODO
      </button>

      <button *ngFor="let item of usuariosHelp" class="btn p-2 btn-light" (click)="agrupar(item)">
        <i class="bx bxs-user"></i>&nbsp;{{ item.nombre + " " + item.apellidoP | uppercase }}
      </button>
    </div>
  </p-overlayPanel>

  <!-- Overlay Panel for Filtros -->
  <p-overlayPanel #opf>
    <div class="d-flex flex-column justify-content-center p-3 gap-2">
      <button *ngIf="filtroActivo" class="btn p-2 btn-light text-start" (click)="aplicarFiltroRapido(null); opf.hide()">
        <i class="bx bx-reset"></i>&nbsp;VER TODO
      </button>

      <button class="btn p-2 text-start" [ngClass]="filtroActivo === 'slaAtencion' ? 'btn-danger text-white' : 'btn-light'" (click)="aplicarFiltroRapido('slaAtencion'); opf.hide()">
        <i class="bx bx-time-five"></i>&nbsp;SLA ATENCIÓN
      </button>

      <button class="btn p-2 text-start" [ngClass]="filtroActivo === 'slaResolucion' ? 'btn-danger text-white' : 'btn-light'" (click)="aplicarFiltroRapido('slaResolucion'); opf.hide()">
        <i class="bx bx-check-shield"></i>&nbsp;SLA RESOLUCIÓN
      </button>

      <button class="btn p-2 text-start" [ngClass]="filtroActivo === 'desbloqueo' ? 'btn-danger text-white' : 'btn-light'" (click)="aplicarFiltroRapido('desbloqueo'); opf.hide()">
        <i class="bx bx-lock-open-alt"></i>&nbsp;DESBLOQUEO
      </button>

      <button class="btn p-2 text-start" [ngClass]="filtroActivo === 'panico' ? 'btn-danger text-white' : 'btn-light'" (click)="aplicarFiltroRapido('panico'); opf.hide()">
        <i class="bx bxs-hot"></i>&nbsp;PÁNICO
      </button>
    </div>
  </p-overlayPanel>

  <!-- Accordions Content -->
  <div *ngIf="usergroup == undefined" class="mt-2">
    <app-acordeon-tickets-por-sucursal [tickets]="tickets" [sucursales]="sucursales"
      [idArea]="idArea"></app-acordeon-tickets-por-sucursal>
  </div>

  <div *ngIf="usergroup != undefined" class="mt-2">
    <app-acordeon-tickets-por-usuario [tickets]="tickets" [usuarioAgrupacion]="usergroup" [sucursales]="sucursales"
      [idArea]="idArea"></app-acordeon-tickets-por-usuario>
  </div>

  <div class="d-flex flex-column align-items-center gap-3 bg-white m-4 justify-content-center p-5 shadow-sm rounded-3"
    *ngIf="tickets.length == 0">
    <i class="bx bx-file-blank bx-md" style="color: rgb(107, 107, 107)"></i>
    <p>SIN TICKETS PENDIENTES</p>
  </div>

  <!-- Modals & Dialogs -->
  <app-solicitar-compra-dialog *ngIf="mostrarModalSolicitarCompra" [mostrarModal]="mostrarModalSolicitarCompra"
    (closeEvent)="mostrarModalSolicitarCompra = false" [idArea]="idArea"></app-solicitar-compra-dialog>

  <app-detalle-ticket-dialog *ngIf="mostrarModalTicketDetail" [ticket]="ticket"
    [showModalTicketDetail]="mostrarModalTicketDetail"
    (closeEvent)="mostrarModalTicketDetail = false"></app-detalle-ticket-dialog>

  <app-crear-ticket-dialog *ngIf="mostrarModalGenerateTicket" [mostrarModalGenerateTicket]="mostrarModalGenerateTicket"
    (closeEvent)="mostrarModalGenerateTicket = false" [idArea]="idArea"></app-crear-ticket-dialog>

  <app-historial-tickets-dialog *ngIf="mostrarModalHistorial" [showModalHistorial]="mostrarModalHistorial"
    (closeEvent)="mostrarModalHistorial = false" [idArea]="idArea"></app-historial-tickets-dialog>

  <app-compras-dialog *ngIf="mostrarModalCompras" [mostrarModal]="mostrarModalCompras" [idArea]="idArea"
    (closeEvent)="mostrarModalCompras = false"></app-compras-dialog>

  <p-toast [breakpoints]="{ '920px': { width: '100%', right: '0', left: '0' } }"
    [showTransformOptions]="'translateY(100%)'" [showTransitionOptions]="'500ms'" [hideTransitionOptions]="'500ms'"
    [showTransformOptions]="'translateX(100%)'"></p-toast>
  <p-confirmDialog>
    <ng-template pTemplate="message" let-message>
      <div class="flex flex-column align-items-center w-full gap-3 border-bottom-1 surface-border">
        <i class="pi pi-exclamation-circle text-6xl text-primary-500"></i>
        <p>{{ message.message }}</p>
      </div>
    </ng-template>
  </p-confirmDialog>

</div>
