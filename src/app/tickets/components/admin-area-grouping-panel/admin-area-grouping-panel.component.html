<div class="grouping-user-menu">
  <div class="grouping-menu-heading">
    <strong>AGRUPAR TICKETS</strong>
    <span>{{ esVistaGlobal ? 'Selecciona un área o una vista general' : 'Selecciona una vista' }}</span>
  </div>

  <button type="button" class="grouping-menu-item grouping-menu-all" (click)="verTodos.emit()">
    <span class="grouping-menu-all-icon" aria-hidden="true">
      <i class="bx bx-buildings"></i>
    </span>
    <span class="grouping-menu-item-label">{{ esVistaGlobal ? 'VER TODAS LAS ÁREAS' : 'VER TODO' }}</span>
    <i class="bx bx-chevron-right grouping-menu-chevron" aria-hidden="true"></i>
  </button>

  <ng-container *ngIf="esVistaGlobal; else usuariosDelArea">
    <ng-container *ngIf="!areaSeleccionada; else listaUsuariosArea">
      <div class="grouping-menu-section-label">AGRUPAR POR ÁREA</div>

      <button
        *ngFor="let area of areas"
        type="button"
        class="grouping-menu-item"
        (click)="seleccionarArea(area)">
        <span class="grouping-menu-all-icon" aria-hidden="true">
          <i class="bx bx-buildings"></i>
        </span>
        <span class="grouping-menu-item-label">{{ area.nombre | uppercase }}</span>
        <i class="bx bx-chevron-right grouping-menu-chevron" aria-hidden="true"></i>
      </button>

      <p *ngIf="areas.length === 0" class="grouping-menu-empty">
        No hay áreas disponibles.
      </p>
    </ng-container>

    <ng-template #listaUsuariosArea>
      <button type="button" class="grouping-menu-back" (click)="volverAListaAreas()">
        <i class="bx bx-arrow-back" aria-hidden="true"></i>
        <span>ÁREAS</span>
      </button>
      <div class="grouping-menu-section-label">{{ areaSeleccionada?.nombre | uppercase }}</div>

      <button
        *ngFor="let usuario of usuariosDeAreaSeleccionada"
        type="button"
        class="grouping-menu-item"
        (click)="seleccionarUsuario.emit(usuario)">
        <span class="grouping-user-avatar" aria-hidden="true">{{ obtenerInicialesUsuario(usuario) }}</span>
        <span class="grouping-menu-item-label">{{ usuario.nombre + " " + usuario.apellidoP | uppercase }}</span>
        <i class="bx bx-chevron-right grouping-menu-chevron" aria-hidden="true"></i>
      </button>

      <p *ngIf="usuariosDeAreaSeleccionada.length === 0" class="grouping-menu-empty">
        No hay usuarios disponibles para esta área.
      </p>
    </ng-template>
  </ng-container>

  <ng-template #usuariosDelArea>
    <div class="grouping-menu-section-label">AGRUPAR POR USUARIO</div>

    <button
      *ngFor="let usuario of usuarios"
      type="button"
      class="grouping-menu-item"
      (click)="seleccionarUsuario.emit(usuario)">
      <span class="grouping-user-avatar" aria-hidden="true">{{ obtenerInicialesUsuario(usuario) }}</span>
      <span class="grouping-menu-item-label">{{ usuario.nombre + " " + usuario.apellidoP | uppercase }}</span>
      <i class="bx bx-chevron-right grouping-menu-chevron" aria-hidden="true"></i>
    </button>
  </ng-template>
</div>
