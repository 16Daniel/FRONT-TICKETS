<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<p-accordion class="w-full">
  <p-accordionTab *ngFor="let item of ordenarSucursalesUser(sucursales)">
    <ng-template pTemplate="header">
      <span class="ms-3 d-flex gap-3 p-3 rounded-3 w-100 align-items-center" [style]="{
          'background-color': obtenerColorDeFondoSucursal(
            obtenerTicketsPorSucursal(item.id).length
          )
        }">

        <p-badge [value]="obtenerTicketsPorSucursal(item.id).length" class="mr-2" [size]="'large'"
          [style]="{ 'background-color': 'white', color: 'black' }" />

        <span class="fw-bold flex-grow-1" [style]="{
              color: obtenerColorDeTexto(
                obtenerTicketsPorSucursal(item.id).length
              )
            }">
          {{ item.nombre }}
        </span>

        <span class="icon-circle bx-tada" *ngIf="verificarTicketsNuevos(obtenerTicketsPorSucursal(item.id))">
          <!-- <i class="pi pi-headphones" pTooltip="NUEVO TICKET" tooltipPosition="top"></i> -->
          <i class="fas fa-headset" style="font-size: 1.5rem; color: #FF0000;" pTooltip="NUEVO TICKET"
            tooltipPosition="top"></i>
        </span>

        <span class="icon-circle bx-tada" *ngIf="verificarChatNoLeido(obtenerTicketsPorSucursal(item.id))">
          <i class="pi pi-comments" style="font-size: 1.5rem; color: #0F99E4;" pTooltip="NUEVO CHAT"
            tooltipPosition="top"></i>
        </span>

      </span>
    </ng-template>

    <div class="d-flex align-items-center gap-4 mt-2">
      <div class="form-check form-switch d-flex align-items-center gap-2 m-0">
        <input class="form-check-input" type="checkbox" role="switch" style="width: 3rem; height: 2rem;"
          [(ngModel)]="mostrarRadiografiaMap[item.id]" />
        <label class="form-check-label fs-6 m-0">MÁS INFORMACIÓN</label>
      </div>
    </div>

    <!-- SECCION: NIVELES DE AUDIO -->
    <div class="mt-3 p-3 border rounded shadow-sm bg-light" *ngIf="mostrarRadiografiaMap[item.id]">
      <h6 class="fw-bold mb-2 text-primary">
        <i class="fas fa-volume-up me-2"></i>Niveles de Audio
      </h6>
      <p class="text-muted small mb-3">
        Sube o visualiza imágenes que sirvan como ejemplo de cómo deben estar correctamente nivelados los equipos de audio en esta sucursal.
      </p>
      
      <div class="d-flex gap-2 align-items-center">
        <!-- Input para subir (oculto y accionado por botón) -->
        <input type="file" #fileInputNiveles multiple accept="image/*" class="d-none" (change)="onFileSelected($event, item)">
        
        <button class="btn btn-outline-primary btn-sm" (click)="fileInputNiveles.click()">
          <i class="fas fa-upload me-1"></i> Subir imágenes
        </button>
        
        <button class="btn btn-outline-info btn-sm" (click)="verImagenes(item)" [disabled]="!item.imagenesNivelesAudio || item.imagenesNivelesAudio.length === 0">
          <i class="fas fa-images me-1"></i> Ver imágenes ({{ item.imagenesNivelesAudio?.length || 0 }})
        </button>
      </div>
    </div>

    <br />

    <app-tpvs-devices-table *ngIf="mostrarRadiografiaMap[item.id] && idArea() == '1'"
      [sucursal]="item"></app-tpvs-devices-table>
    <app-tabla-tvs-bocinas *ngIf="mostrarRadiografiaMap[item.id] && idArea() == '2'"
      [sucursal]="item"></app-tabla-tvs-bocinas>

    <app-grafica-tickets-30-dias *ngIf="mostrarRadiografiaMap[item.id]" [idSucursal]="item.id"
      [idArea]="usuario.idArea"></app-grafica-tickets-30-dias>
    <app-requester-tickets-list [tickets]="obtenerTicketsPorSucursal(item.id)" [esEspectadorActivo]="esEspectadorActivo"
      (clickEvent)="abrirModalDetalleTicket($event)" [mostrarAccionFinalizar]="false"
      [mostrarEstrellas]="false"></app-requester-tickets-list>
  </p-accordionTab>
</p-accordion>

<app-modal-visor-varias-imagenes
  *ngIf="mostrarVisorImagenes"
  [mostrarModal]="mostrarVisorImagenes"
  [imagenes]="imagenesVisor"
  titulo="Niveles de Audio - {{ sucursalSeleccionada?.nombre }}"
  [mostrarBotonEliminar]="true"
  (closeEvent)="mostrarVisorImagenes = false"
  (imagenEliminadaEvent)="onImagenEliminada($event)">
</app-modal-visor-varias-imagenes>
