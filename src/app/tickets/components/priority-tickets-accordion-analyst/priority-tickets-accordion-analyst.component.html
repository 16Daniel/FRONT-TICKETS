<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<p-accordion class="custom-branches-accordion w-full">
  <p-accordionTab *ngFor="let item of ordenarSucursalesUser(sucursales)">
    <ng-template pTemplate="header">
      <div class="branch-accordion-header" [ngClass]="obtenerClaseEstado(obtenerScoreMaximoSucursal(item.id))">
        
        <div class="branch-info-group">
          <!-- Clean Number Badge ONLY -->
          <div class="branch-count-badge">
            {{ obtenerTicketsPorSucursal(item.id).length }}
          </div>

          <!-- Branch Name ONLY -->
          <span class="branch-title">{{ item.nombre }}</span>
        </div>

        <!-- Action / Alert Badges -->
        <div class="branch-actions-indicators">
          <span class="indicator-badge badge-new" 
            *ngIf="verificarTicketsNuevos(obtenerTicketsPorSucursal(item.id))" 
            pTooltip="NUEVO TICKET" tooltipPosition="top">
            <i class="bx bx-bell bx-tada"></i>
          </span>

          <span class="indicator-badge badge-chat" 
            *ngIf="verificarChatNoLeido(obtenerTicketsPorSucursal(item.id))" 
            pTooltip="NUEVO CHAT" tooltipPosition="top">
            <i class="bx bx-message-square-dots bx-tada"></i>
          </span>
        </div>
      </div>
    </ng-template>

    <!-- Sub-toggles inside accordion body -->
    <div class="accordion-subtoggles-strip">
      <div class="form-check form-switch d-flex align-items-center gap-2 m-0">
        <input class="form-check-input custom-switch" type="checkbox" role="switch"
          [(ngModel)]="mostrarRadiografiaMap[item.id]" />
        <label class="form-check-label m-0">📊 MÁS INFORMACIÓN</label>
      </div>
    </div>

    <div class="accordion-tables-wrapper">
      <!-- SECCION: NIVELES DE AUDIO -->
      <app-niveles-audio [sucursal]="item" *ngIf="mostrarRadiografiaMap[item.id] && idArea() == '1'"></app-niveles-audio>

      <app-tpvs-devices-table *ngIf="mostrarRadiografiaMap[item.id] && idArea() == '1'"
        [sucursal]="item"></app-tpvs-devices-table>
      <app-tabla-tvs-bocinas *ngIf="mostrarRadiografiaMap[item.id] && idArea() == '2'"
        [sucursal]="item"></app-tabla-tvs-bocinas>

      <app-grafica-tickets-30-dias *ngIf="mostrarRadiografiaMap[item.id]" [idSucursal]="item.id"
        [idArea]="usuario.idArea"></app-grafica-tickets-30-dias>
      <app-requester-tickets-list *ngIf="!mostrarRadiografiaMap[item.id]" [tickets]="obtenerTicketsPorSucursal(item.id)" [esEspectadorActivo]="esEspectadorActivo"
        (clickEvent)="abrirModalDetalleTicket($event)" [mostrarAccionFinalizar]="false"
        [mostrarEstrellas]="false"></app-requester-tickets-list>
    </div>
  </p-accordionTab>
</p-accordion>
