<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<p-tabView (onChange)="onTabChange($event)" [activeIndex]="activeIndex">
  @for (area of areasTicket; track area.id) {
    <p-tabPanel [header]="area.nombre | uppercase">
      <ng-container *ngIf="tabsActivos[area.nombre | uppercase]">
        <app-admin-area-tab [idArea]="area.id" [areaName]="area.nombre"></app-admin-area-tab>
      </ng-container>
    </p-tabPanel>
  }
</p-tabView>
