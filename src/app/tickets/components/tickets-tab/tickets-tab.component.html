<div class="tickets-tab-container">
  
  <!-- Top Bar: Context Badges & Switches -->
  <div class="tickets-top-bar">
    <div class="header-title-group">
      <span class="active-view-badge bg-warning text-dark border-warning" *ngIf="usuario.esGuardia">
        <i class="bx bx-shield-quarter"></i>
        <span>GUARDIA ACTIVA</span>
      </span>
    </div>

    <!-- Toggles for Guardia -->
    <div class="switches-toggle-group">
      <span class="switches-title">
        <i class="bx bx-wrench"></i> Vistas:
      </span>

      <label class="toggle-pill-item" [class.is-active]="usuario.esGuardia">
        <input 
          type="checkbox" 
          class="toggle-checkbox"
          [(ngModel)]="usuario.esGuardia" 
          (change)="onToggleGuardia(usuario)">
        <span class="toggle-pill-btn">
          <i class="bx bx-shield"></i>
          <span>Guardia</span>
        </span>
      </label>
    </div>
  </div>

  <!-- Dashboard KPI Cards Row: Split Layout (Operación Diaria + Rendimiento Mensual) -->
  <div class="dashboard-unified-kpi-row mb-3" *ngIf="totalesSla">
    <div class="kpi-operational-col">
      <app-iconos-notificaciones-tickets 
        [tickets]="tickets" 
        [usuario]="usuario"
        [compras]="compras">
      </app-iconos-notificaciones-tickets>
    </div>
    <div class="kpi-sla-col">
      <app-tarjeta-rendimiento-sla
        [totales]="totalesSla"
        [loading]="loadingSla"
        [mesNombre]="mesNombre">
      </app-tarjeta-rendimiento-sla>
    </div>
  </div>

  <div class="dashboard-kpi-section mb-3" *ngIf="!totalesSla">
    <app-iconos-notificaciones-tickets 
      [tickets]="tickets" 
      [usuario]="usuario"
      [compras]="compras">
    </app-iconos-notificaciones-tickets>
  </div>

  <!-- Action Buttons Toolbar Row -->
  <div class="actions-toolbar-row mb-4">
    <div class="actions-buttons-container">
      <p-button 
        label="CREAR TICKET" 
        icon="pi pi-plus" 
        styleClass="p-button-primary action-btn-custom"
        (click)="mostrarModalGenerateTicket = true">
      </p-button>

      <!-- <p-button 
        label="HISTORIAL TICKETS" 
        icon="pi pi-history" 
        styleClass="p-button-warning action-btn-custom"
        (click)="mostrarModalHistorial = true">
      </p-button>

      <p-button 
        label="FILTRAR TICKETS" 
        icon="pi pi-filter" 
        styleClass="p-button-success action-btn-custom"
        (click)="mostrarModalFilterTickets = true">
      </p-button> -->

      <!-- <p-button 
        label="SOLICITAR COMPRA" 
        icon="pi pi-plus" 
        styleClass="p-button-secondary action-btn-custom"
        (click)="mostrarModalCompras = true">
      </p-button> -->
    </div>
  </div>

  <div class="d-flex flex-column align-items-center gap-3 bg-white m-4 justify-content-center p-5 shadow-sm rounded-3"
    *ngIf="tickets.length == 0">
    @if (loading) {
    <i class="bx bx-loader bx-lg bx-spin" style="color: rgb(0, 153, 255)"></i>
    }@else {
    <i class="bx bx-file-blank bx-md" style="color: rgb(43, 92, 226)"></i>
    <p>SIN TICKETS PENDIENTES</p>
    }
  </div>

  <div *ngIf="tickets.length > 0" class="p-1 mt-4">
    <app-priority-tickets-accordion-analyst [tickets]="tickets" [sucursales]="sucursales"
      (clickEvent)="abrirModalDetalleTicket($event)" [idArea]="usuario.idArea"></app-priority-tickets-accordion-analyst>
  </div>

</div>


<app-solicitar-compra-dialog *ngIf="mostrarModalCompras" [mostrarModal]="mostrarModalCompras"
  (closeEvent)="mostrarModalCompras = false"></app-solicitar-compra-dialog>

<app-crear-ticket-dialog *ngIf="mostrarModalGenerateTicket" [mostrarModalGenerateTicket]="mostrarModalGenerateTicket"
  (closeEvent)="mostrarModalGenerateTicket = false" [idArea]="usuario.idArea"></app-crear-ticket-dialog>

<app-detalle-ticket-dialog *ngIf="mostrarModalTicketDetail" [ticket]="itemtk"
  [showModalTicketDetail]="mostrarModalTicketDetail"
  (closeEvent)="mostrarModalTicketDetail = false"></app-detalle-ticket-dialog>

<app-historial-tickets-dialog *ngIf="mostrarModalHistorial" [showModalHistorial]="mostrarModalHistorial"
  (closeEvent)="mostrarModalHistorial = false" [idArea]="usuario.idArea"></app-historial-tickets-dialog>

<p-toast [breakpoints]="{ '920px': { width: '100%', right: '0', left: '0' } }"
  [showTransformOptions]="'translateY(100%)'" [showTransitionOptions]="'500ms'" [hideTransitionOptions]="'500ms'"
  [showTransformOptions]="'translateX(100%)'"></p-toast>

<p-confirmDialog>
  <ng-template pTemplate="message" let-message>
    <div class="flex flex-column align-items-center w-full gap-3 border-bottom-1 surface-border">
      <i class="pi pi-exclamation-circle text-6xl text-primary-500"></i>
      <p>{{ message.message }}</p>
    </div>
  </ng-template>
</p-confirmDialog>
