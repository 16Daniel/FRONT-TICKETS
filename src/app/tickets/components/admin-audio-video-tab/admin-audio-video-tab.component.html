<div class="tickets-tab-container">

  <!-- Top Bar: Title & Maintenance Switches -->
  <div class="tickets-top-bar">
    <div class="header-title-group">
      <h2 class="header-main-title">
        <i class="bx bx-purchase-tag-alt"></i>
        <span>TICKETS</span>
      </h2>

      <span class="active-view-badge" *ngIf="mostrarMantenimientosAV">
        <i class="bx bx-tv"></i>
        <span>Mantenimiento AV (6X6)</span>
      </span>

      <span class="active-view-badge" *ngIf="mostrarMantenimientos">
        <i class="bx bx-laptop"></i>
        <span>Mantenimiento IT (8X8)</span>
      </span>

      <span class="user-group-badge" *ngIf="usergroup">
        <i class="bx bxs-user"></i>
        <span>{{ usergroup.nombre }} {{ usergroup.apellidoP }}</span>
      </span>
    </div>

    <!-- Toggles for AV: 6X6 and IT: 8X8 -->
    <div class="switches-toggle-group">
      <span class="switches-title">
        <i class="bx bx-wrench"></i> Mantenimientos:
      </span>

      <label class="toggle-pill-item" [class.is-active]="mostrarMantenimientosAV">
        <input 
          type="checkbox" 
          class="toggle-checkbox"
          [(ngModel)]="mostrarMantenimientosAV" 
          (ngModelChange)="mostrarMantenimientos = false">
        <span class="toggle-pill-btn">
          <i class="bx bx-tv"></i>
          <span>AV: 6X6</span>
        </span>
      </label>

      <label class="toggle-pill-item" [class.is-active]="mostrarMantenimientos">
        <input 
          type="checkbox" 
          class="toggle-checkbox"
          [(ngModel)]="mostrarMantenimientos" 
          (ngModelChange)="mostrarMantenimientosAV = false">
        <span class="toggle-pill-btn">
          <i class="bx bx-laptop"></i>
          <span>IT: 8X8</span>
        </span>
      </label>
    </div>
  </div>

  <!-- Dashboard KPI Cards Row (Floating directly on canvas) -->
  <div class="dashboard-kpi-section mb-3">
    <app-iconos-notificaciones-tickets 
      [tickets]="tickets" 
      [usuario]="usergroup"
      [compras]="compras">
    </app-iconos-notificaciones-tickets>
  </div>

  <!-- Action Buttons Toolbar Row (Floating directly on canvas) -->
  <div class="actions-toolbar-row mb-4">
    <div class="actions-buttons-container">
      <p-button 
        label="CREAR TICKET" 
        icon="pi pi-plus" 
        styleClass="p-button-primary action-btn-custom"
        (click)="mostrarModalGenerateTicket = true">
      </p-button>

      <p-button 
        label="HISTORIAL TICKETS" 
        icon="pi pi-history" 
        styleClass="p-button-warning action-btn-custom"
        (click)="mostrarModalHistorial = true">
      </p-button>

      <p-button 
        label="FILTRAR TICKETS" 
        icon="pi pi-filter" 
        styleClass="p-button-success action-btn-custom"
        (click)="mostrarModalFilterTickets = true">
      </p-button>

      <p-button 
        (onClick)="opg.toggle($event)" 
        icon="pi pi-users" 
        label="AGRUPAR" 
        styleClass="p-button-danger action-btn-custom">
      </p-button>

      <p-button 
        label="COMPRAS" 
        icon="pi pi-shopping-cart" 
        styleClass="btn-compras action-btn-custom" 
        (click)="mostrarModalCompras = true">
      </p-button>

      <p-button 
        label="SOLICITAR COMPRA" 
        icon="pi pi-plus" 
        styleClass="p-button-secondary action-btn-custom"
        (click)="mostrarModalSolicitarCompra = true">
      </p-button>
    </div>
  </div>

  <!-- Overlay Panel for Agrupar -->
  <p-overlayPanel #opg>
    <div class="d-flex flex-column justify-content-center p-3 gap-2">
      <button class="btn p-2 btn-light" (click)="agruparPorSucursal()">
        <i class="bx bx-buildings"></i>&nbsp;VER TODO
      </button>

      <button *ngFor="let item of usuariosHelp" class="btn p-2 btn-light" (click)="agrupar(item)">
        <i class="bx bxs-user"></i>&nbsp;{{ item.nombre + " " + item.apellidoP | uppercase }}
      </button>
    </div>
  </p-overlayPanel>

  <!-- Accordions Content -->
  @if(mostrarMantenimientos) {
  <div class="mt-2">
    <app-acordeon-mantenimientos-sistemas *ngIf="auxMostrarMantenimientos" [mantenimientos]="mantenimientos"
      [sucursales]="sucursalesMantenimeintosActivos()" [ordenarMantenimientosFecha]="ordenarMantenimientosFecha"
      [mostrarChat]="true"></app-acordeon-mantenimientos-sistemas>
  </div>
  }
  @else if(mostrarMantenimientosAV) {
  <div class="mt-2">
    <app-acordeon-mantenimientos-audio-video *ngIf="auxMostrarMantenimientosAV" [mantenimientos]="mantenimientosAV"
      [sucursales]="sucursalesMantenimeintosActivos()" [ordenarMantenimientosFecha]="ordenarMantenimientosFecha"
      [mostrarChat]="true"></app-acordeon-mantenimientos-audio-video>
  </div>
  }
  @else {
  <div *ngIf="usergroup == undefined" class="mt-2">
    <app-branches-tickets-accordion [tickets]="tickets" [sucursales]="sucursales"
      [idArea]="idArea"></app-branches-tickets-accordion>
  </div>

  <div *ngIf="usergroup != undefined" class="mt-2">
    <app-user-tickets-accordion [tickets]="tickets" [usuarioAgrupacion]="usergroup" [sucursales]="sucursales"
      [idArea]="idArea"></app-user-tickets-accordion>
  </div>

  <div class="d-flex flex-column align-items-center gap-3 bg-white m-4 justify-content-center p-5 shadow-sm rounded-3"
    *ngIf="tickets.length == 0">
    <i class="bx bx-file-blank bx-md" style="color: rgb(107, 107, 107)"></i>
    <p>SIN TICKETS PENDIENTES</p>
  </div>
  }

  <!-- Modals & Dialogs -->
  <app-solicitar-compra-dialog *ngIf="mostrarModalSolicitarCompra" [mostrarModal]="mostrarModalSolicitarCompra"
    (closeEvent)="mostrarModalSolicitarCompra = false" [idArea]="idArea"></app-solicitar-compra-dialog>

  <app-modal-ticket-detail *ngIf="mostrarModalTicketDetail" [ticket]="ticket"
    [showModalTicketDetail]="mostrarModalTicketDetail"
    (closeEvent)="mostrarModalTicketDetail = false"></app-modal-ticket-detail>

  <app-crear-ticket-dialog *ngIf="mostrarModalGenerateTicket" [mostrarModalGenerateTicket]="mostrarModalGenerateTicket"
    (closeEvent)="mostrarModalGenerateTicket = false" idArea="2"></app-crear-ticket-dialog>

  <app-modal-filter-tickets [showModalFilterTickets]="mostrarModalFilterTickets" [tickets]="todosLostickets"
    [sucursales]="sucursales" (closeEvent)="mostrarModalFilterTickets = false"
    (ticketsFiltradosEvent)="tickets = $event"></app-modal-filter-tickets>

  <app-historial-tickets-dialog *ngIf="mostrarModalHistorial" [showModalHistorial]="mostrarModalHistorial"
    (closeEvent)="mostrarModalHistorial = false" [idArea]="idArea"></app-historial-tickets-dialog>

  <app-compras-dialog *ngIf="mostrarModalCompras" [mostrarModal]="mostrarModalCompras" [idArea]="idArea"
    (closeEvent)="mostrarModalCompras = false"></app-compras-dialog>

  <p-toast [breakpoints]="{ '920px': { width: '100%', right: '0', left: '0' } }"
    [showTransformOptions]="'translateY(100%)'" [showTransitionOptions]="'500ms'" [hideTransitionOptions]="'500ms'"
    [showTransformOptions]="'translateX(100%)'"></p-toast>
  <p-confirmDialog>
    <ng-template pTemplate="message" let-message>
      <div class="flex flex-column align-items-center w-full gap-3 border-bottom-1 surface-border">
        <i class="pi pi-exclamation-circle text-6xl text-primary-500"></i>
        <p>{{ message.message }}</p>
      </div>
    </ng-template>
  </p-confirmDialog>

</div>
