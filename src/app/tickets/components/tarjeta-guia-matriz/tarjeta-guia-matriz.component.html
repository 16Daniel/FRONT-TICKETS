<div class="tarjeta-guia-matriz mb-4" *ngIf="mostrar">
  <div class="encabezado-guia">
    <div class="titulo-guia">
      <i class="bx bx-info-circle"></i>
      <span>Matriz de Criticidad 3×3 y Niveles de Prioridad</span>
    </div>
    <button type="button" class="btn-cerrar-guia" (click)="cerrar.emit()">
      <i class="bx bx-x"></i>
    </button>
  </div>
  <p class="descripcion-guia">
    La prioridad de cada categoría y ticket se calcula automáticamente multiplicando <b>Impacto (1-3)</b> × <b>Urgencia (1-3)</b>.
  </p>

  <div class="cuadricula-cuadrantes">
    <div *ngFor="let c of CUADRANTES" class="tarjeta-cuadrante" [style.background]="c.bg" [style.color]="c.text">
      <div class="encabezado-cuadrante">
        <div class="icono-cuadrante" [style.color]="c.text">
          <i class="bx {{ c.icon }}"></i>
        </div>
        <span class="nombre-cuadrante">{{ c.label }}</span>
        <span class="score-cuadrante">Score {{ c.min }}–{{ c.max }}</span>
      </div>
      <p class="descripcion-cuadrante">{{ c.desc }}</p>
    </div>
  </div>
</div>
