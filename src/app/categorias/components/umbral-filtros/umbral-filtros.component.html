    <!-- Filtros -->
    <div class="filters-bar mb-3">
      <div class="filter-group">
        <label>Fecha Inicio</label>
        <p-calendar 
          [(ngModel)]="fechaInicio" 
          dateFormat="dd/mm/yy" 
          [showIcon]="true"
          placeholder="Selecciona inicio">
        </p-calendar>
      </div>

      <div class="filter-group">
        <label>Fecha Fin</label>
        <p-calendar 
          [(ngModel)]="fechaFin" 
          dateFormat="dd/mm/yy" 
          [showIcon]="true"
          placeholder="Selecciona fin">
        </p-calendar>
      </div>

      <div class="filter-group flex-grow-1">
        <label>Sucursales (Opcional)</label>
        <p-multiSelect 
          [options]="sucursales" 
          [(ngModel)]="sucursalesSeleccionadas" 
          optionLabel="nombre" 
          placeholder="Todas las sucursales"
          [filter]="true"
          display="chip"
          [style]="{'width':'100%'}">
        </p-multiSelect>
      </div>

      <div class="filter-group flex-grow-1">
        <label>Especialistas (Opcional)</label>
        <p-multiSelect 
          [options]="usuariosRol4" 
          [(ngModel)]="usuariosSeleccionados" 
          optionLabel="nombreCompleto" 
          placeholder="Todos los especialistas"
          [filter]="true"
          display="chip"
          [style]="{'width':'100%'}">
        </p-multiSelect>
      </div>

      <div class="filter-group" style="min-width: auto;">
        <button 
          type="button" 
          class="btn btn-primary" 
          [disabled]="isApplyingFilters"
          (click)="onApply()">
          <i class="bx" [ngClass]="isApplyingFilters ? 'bx-loader-alt bx-spin' : 'bx-filter-alt'"></i>
          {{ isApplyingFilters ? 'Calculando...' : 'Aplicar' }}
        </button>
      </div>
    </div>
