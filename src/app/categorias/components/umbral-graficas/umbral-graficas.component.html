    <!-- Sección de Gráficas ngx-charts -->
    <div class="charts-layout" *ngIf="!isApplyingFilters && (datosCategorias.length > 0 || datosSucursales.length > 0)">
      
      <!-- Fila 1: Categorías -->
      <div class="chart-card">
        <div class="chart-row-internal">
          
          <!-- Izquierda: Barras -->
          <div class="chart-side flex-1 border-r">
            <h3 class="chart-title">Tickets por Categoría</h3>
            <p class="chart-subtitle text-muted mb-3" style="font-size: 0.85rem;">Clic en una barra para ver sus detalles SLA.</p>
            <div class="chart-scroll-container">
              <div class="chart-inner-wrapper" [style.height]="getChartHeight(datosCategorias)">
                <ngx-charts-bar-horizontal
                  [results]="reversedDatosCategorias"
                  [scheme]="colorScheme"
                  [xAxis]="true"
                  [yAxis]="true"
                  [legend]="false"
                  [showXAxisLabel]="true"
                  [showYAxisLabel]="false"
                  xAxisLabel="Cantidad de Tickets"
                  [barPadding]="8"
                  [roundEdges]="true"
                  [gradient]="false"
                  [tooltipDisabled]="false"
                  (select)="onSelectCategoria($event)">
                </ngx-charts-bar-horizontal>
              </div>
            </div>
          </div>

          <!-- Derecha: Radar (Categorías) -->
          <div class="chart-side flex-1">
            <app-umbral-radar-chart
              [selectedItem]="selectedCategoriaRadar"
              [dataGeneral]="radarDataGeneral"
              [dataDictionary]="radarDataCategorias"
              [colorScheme]="colorScheme">
            </app-umbral-radar-chart>
          </div>
          
        </div>
      </div>

      <!-- Fila 2: Sucursales -->
      <div class="chart-card mt-4">
        <div class="chart-row-internal">
          
          <!-- Izquierda: Barras -->
          <div class="chart-side flex-1 border-r">
            <h3 class="chart-title">Tickets por Sucursal</h3>
            <p class="chart-subtitle text-muted mb-3" style="font-size: 0.85rem;">Clic en una barra para ver sus detalles SLA.</p>
            <div class="chart-scroll-container">
              <div class="chart-inner-wrapper" [style.height]="getChartHeight(datosSucursales)">
                <ngx-charts-bar-horizontal
                  [results]="reversedDatosSucursales"
                  [scheme]="colorScheme"
                  [xAxis]="true"
                  [yAxis]="true"
                  [legend]="false"
                  [showXAxisLabel]="true"
                  [showYAxisLabel]="false"
                  xAxisLabel="Cantidad de Tickets"
                  [barPadding]="8"
                  [roundEdges]="true"
                  [gradient]="false"
                  [tooltipDisabled]="false"
                  (select)="onSelectSucursal($event)">
                </ngx-charts-bar-horizontal>
              </div>
            </div>
          </div>

          <!-- Derecha: Radar (Sucursales) -->
          <div class="chart-side flex-1">
            <app-umbral-radar-chart
              [selectedItem]="selectedSucursalRadar"
              [dataGeneral]="radarDataGeneral"
              [dataDictionary]="radarDataSucursales"
              [colorScheme]="colorScheme">
            </app-umbral-radar-chart>
          </div>
          
        </div>
      </div>

      <!-- Fila 3: Usuarios Responsables -->
      <div class="chart-card mt-4">
        <div class="chart-row-internal">
          
          <!-- Izquierda: Barras -->
          <div class="chart-side flex-1 border-r">
            <h3 class="chart-title">Tickets por Usuario</h3>
            <p class="chart-subtitle text-muted mb-3" style="font-size: 0.85rem;">Clic en una barra para ver sus detalles SLA.</p>
            <div class="chart-scroll-container">
              <div class="chart-inner-wrapper" [style.height]="getChartHeight(datosUsuarios)">
                <ngx-charts-bar-horizontal
                  [results]="reversedDatosUsuarios"
                  [scheme]="colorScheme"
                  [xAxis]="true"
                  [yAxis]="true"
                  [legend]="false"
                  [showXAxisLabel]="true"
                  [showYAxisLabel]="false"
                  xAxisLabel="Cantidad de Tickets"
                  [barPadding]="8"
                  [roundEdges]="true"
                  [gradient]="false"
                  [tooltipDisabled]="false"
                  (select)="onSelectUsuario($event)">
                </ngx-charts-bar-horizontal>
              </div>
            </div>
          </div>

          <!-- Derecha: Radar (Usuarios) -->
          <div class="chart-side flex-1">
            <app-umbral-radar-chart
              [selectedItem]="selectedUsuarioRadar"
              [dataGeneral]="radarDataGeneral"
              [dataDictionary]="radarDataUsuarios"
              [colorScheme]="colorScheme">
            </app-umbral-radar-chart>
          </div>
          
        </div>
      </div>

    </div>
