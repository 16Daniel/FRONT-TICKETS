<div class="categories-tree-page-wrapper">
  <div class="categories-content-container">

    <!-- Encabezado de Página Reutilizable -->
    <app-page-header 
      subtitle="Configuración de Umbrales" 
      title="Umbral de Recurrencias">
    </app-page-header>

    <!-- Barra Selector de Áreas por Chips (debajo del título) -->
    <div class="areas-chips-track mb-4">
      <button 
        *ngFor="let area of areas" 
        type="button" 
        class="chip-area-pill"
        [class.is-active]="String(area.id) === areaSeleccionadaId"
        (click)="cambiarArea(area.id)">
        <span class="area-dot"></span>
        <span class="area-name">{{ area.nombre }}</span>
      </button>
    </div>

    <!-- Tarjetas KPI -->
    <app-umbral-kpis 
      [tickets]="tickets"
      [sucursales]="sucursales"
      [usuariosRol4]="usuariosRol4"
      [isApplyingFilters]="isApplyingFilters">
    </app-umbral-kpis>

    <!-- Barra de Filtros -->
    <app-umbral-filtros 
      [sucursales]="sucursales"
      [usuariosRol4]="usuariosRol4"
      [isApplyingFilters]="isApplyingFilters"
      [initialFechaInicio]="fechaInicio"
      [initialFechaFin]="fechaFin"
      (apply)="aplicarFiltrosEvent($event)">
    </app-umbral-filtros>

    <!-- Árbol de Organización -->
    <app-umbral-arbol 
      [tickets]="tickets"
      [categoriasActuales]="categoriasActuales"
      [areas]="areas"
      [areaSeleccionadaId]="areaSeleccionadaId"
      [hasCategories]="categoriasActuales.length > 0">
    </app-umbral-arbol>

    <!-- Sección de Gráficas Especializadas -->
    <div class="charts-layout" *ngIf="!isApplyingFilters && tickets.length > 0">
      
      <!-- Fila 1: Categorías -->
      <app-grafica-desempeno-categorias
        [tickets]="tickets"
        [matrizUrgencia]="matrizUrgenciaArea"
        [colorScheme]="colorScheme">
      </app-grafica-desempeno-categorias>

      <!-- Fila 2: Sucursales -->
      <app-grafica-desempeno-sucursales
        [tickets]="tickets"
        [sucursales]="sucursales"
        [matrizUrgencia]="matrizUrgenciaArea"
        [colorScheme]="colorScheme">
      </app-grafica-desempeno-sucursales>

      <!-- Fila 3: Usuarios Responsables -->
      <app-grafica-desempeno-responsables
        [tickets]="tickets"
        [usuarios]="usuariosRol4"
        [matrizUrgencia]="matrizUrgenciaArea"
        [colorScheme]="colorScheme">
      </app-grafica-desempeno-responsables>

    </div>

  </div>
</div>
