<p-dialog
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '44rem', maxWidth: '95vw' }"
  [breakpoints]="{ '1199px': '90vw', '575px': '100vw' }"
  [maximizable]="true"
  [draggable]="false"
  styleClass="agregar-recoleccion-dialog"
  (onHide)="onHide()">

  <ng-template pTemplate="header">
    <div class="modal-custom-header">
      <h4 class="m-0 fw-bold text-dark d-flex align-items-center gap-2">
        <i class="bx text-danger" [ngClass]="trampaDeAceite ? 'bx-filter-alt' : 'bx-droplet'"></i>
        {{ trampaDeAceite ? 'Agregar Recolección — Trampa de Grasa' : 'Agregar Recolección de Aceite' }}
      </h4>
    </div>
  </ng-template>

  <div class="agregar-recoleccion-body">
    <div class="rw-form-card">
      <div class="rw-card-header">
        <div class="rw-card-title">
          <i class="bx bx-calendar-plus"></i>
          <span>DATOS DE LA RECOLECCIÓN</span>
        </div>
        <span class="rw-type-pill">
          {{ trampaDeAceite ? 'Trampa de grasa' : 'Aceite quemado' }}
        </span>
      </div>

      <div class="rw-form-grid">
        <div class="rw-field-item">
          <label class="rw-field-label">SUCURSAL</label>
          <p-dropdown
            [options]="sucursales"
            [(ngModel)]="sucursal"
            name="sucursal"
            optionLabel="nombre"
            [filter]="true"
            filterBy="nombre"
            [showClear]="true"
            placeholder="Selecciona una sucursal..."
            appendTo="body"
            styleClass="rw-dropdown-h42 w-100"
            [style]="{ width: '100%' }">
            <ng-template pTemplate="selectedItem" let-selectedOption>
              <div class="d-flex align-items-center gap-2">
                <div>{{ selectedOption.nombre }}</div>
              </div>
            </ng-template>
            <ng-template let-dep pTemplate="item">
              <div class="d-flex align-items-center gap-2">
                <div>{{ dep.nombre }}</div>
              </div>
            </ng-template>
          </p-dropdown>
        </div>

        <div class="rw-field-item">
          <label class="rw-field-label" for="fechaRecoleccion">FECHA DE RECOLECCIÓN</label>
          <p-calendar
            [(ngModel)]="fecha"
            [iconDisplay]="'input'"
            [showIcon]="true"
            inputId="fechaRecoleccion"
            dateFormat="dd/mm/yy"
            appendTo="body"
            styleClass="rw-calendar-h42 w-100"
            [style]="{ width: '100%' }">
          </p-calendar>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end">
      @if (trampaDeAceite == true) {
        <button
          type="button"
          class="btn-rw-cta rw-btn-mobile-full"
          [disabled]="loading || sucursal == undefined || fecha == undefined"
          (click)="guardarTA()">
          <i class="bx" [ngClass]="loading ? 'bx-loader-alt bx-spin' : 'bx-save'"></i>
          <span>{{ loading ? 'GUARDANDO...' : 'GUARDAR RECOLECCIÓN' }}</span>
        </button>
      } @else {
        <button
          type="button"
          class="btn-rw-cta rw-btn-mobile-full"
          [disabled]="loading || sucursal == undefined || fecha == undefined"
          (click)="guardar()">
          <i class="bx" [ngClass]="loading ? 'bx-loader-alt bx-spin' : 'bx-save'"></i>
          <span>{{ loading ? 'GUARDANDO...' : 'GUARDAR RECOLECCIÓN' }}</span>
        </button>
      }
    </div>
  </div>
</p-dialog>
