<p-dialog
  [header]="esNuevoComite ? 'CREAR COMITÉ' : 'ACTUALIZAR COMITÉ'"
  [(visible)]="mostrarModalCrearComite"
  [modal]="true"
  [breakpoints]="{ '768px': '95vw', '560px': '100vw' }"
  [style]="{ width: '42rem', maxWidth: '95vw' }"
  (onHide)="onHide()">

  <form #form="ngForm" (ngSubmit)="enviar(form)" class="mt-3">
    <div class="row gy-4">
      <div class="col-12 col-md-5">
        <label class="rw-form-label" for="comiteId">ID</label>
        <input
          id="comiteId"
          class="form-control rw-input"
          type="text"
          placeholder="ID (Automático)"
          [(ngModel)]="comite.id"
          name="id"
          #formIdCtrl="ngModel"
          [ngClass]="{ 'p-invalid': formIdCtrl.invalid && formIdCtrl.touched }"
          disabled
          required>
        <small *ngIf="formIdCtrl.invalid && formIdCtrl.touched" class="p-error d-block mt-1">
          No se pudo asignar el ID del comité.
        </small>
      </div>

      <div class="col-12 col-md-7">
        <label class="rw-form-label" for="comiteNombre">NOMBRE</label>
        <input
          id="comiteNombre"
          class="form-control rw-input"
          type="text"
          placeholder="Nombre del comité"
          [(ngModel)]="comite.nombre"
          name="nombre"
          #formNombreCtrl="ngModel"
          [ngClass]="{ 'p-invalid': formNombreCtrl.invalid && formNombreCtrl.touched }"
          required>
        <small *ngIf="formNombreCtrl.invalid && formNombreCtrl.touched" class="p-error d-block mt-1">
          Campo requerido.
        </small>
      </div>

      <div class="col-12">
        <label class="rw-form-label" for="comiteAreas">ÁREAS</label>
        <p-multiSelect
          inputId="comiteAreas"
          [options]="(areasService.areas$ | async) ?? []"
          [ngModel]="comite.areas"
          name="areas"
          optionLabel="nombre"
          optionValue="id"
          [filter]="true"
          filterBy="nombre"
          [showClear]="true"
          display="chip"
          [maxSelectedLabels]="3"
          selectedItemsLabel="{0} áreas seleccionadas"
          placeholder="Selecciona las áreas del comité"
          appendTo="body"
          (ngModelChange)="onAreasChange($event)"
          styleClass="w-100">
        </p-multiSelect>
      </div>

      <div class="col-12">
        <label class="rw-form-label" for="comiteResponsables">RESPONSABLES</label>
        <p-multiSelect
          inputId="comiteResponsables"
          [options]="responsablesFiltrados"
          [ngModel]="comite.idsResponsables"
          name="idsResponsables"
          optionLabel="nombre"
          optionValue="id"
          [filter]="true"
          filterBy="nombre"
          [showClear]="true"
          display="chip"
          [maxSelectedLabels]="3"
          selectedItemsLabel="{0} responsables seleccionados"
          placeholder="Selecciona los responsables del comité"
          [disabled]="!comite.areas.length"
          appendTo="body"
          (ngModelChange)="onResponsablesChange($event)"
          styleClass="w-100">
          <ng-template let-responsable pTemplate="item">
            <div class="d-flex flex-column">
              <span>{{ responsable.nombre }}</span>
              <small class="text-muted">{{ obtenerAreaResponsable(responsable) }}</small>
            </div>
          </ng-template>
        </p-multiSelect>
        <small *ngIf="!comite.areas.length" class="text-muted d-block mt-1">
          Selecciona al menos un área para consultar sus responsables.
        </small>
        <div *ngIf="obtenerResponsablesSeleccionados().length" class="comite-responsables">
          <span class="comite-responsables-label">
            {{ comite.idResponsableLider ? 'Líder del comité' : 'Haz clic en un avatar para elegir al líder' }}
          </span>
          <div class="comite-avatars">
            <button
              *ngFor="let responsable of obtenerResponsablesSeleccionados()"
              type="button"
              class="comite-avatar"
              [class.selected]="comite.idResponsableLider === responsable.id"
              [attr.aria-label]="'Elegir a ' + responsable.nombre + ' como líder del comité'"
              [attr.aria-pressed]="comite.idResponsableLider === responsable.id"
              (click)="seleccionarLider(responsable)"
              [pTooltip]="comite.idResponsableLider === responsable.id
                ? 'LÍDER DEL COMITÉ: ' + responsable.nombre
                : 'Elegir como líder: ' + responsable.nombre"
              tooltipPosition="top">
              <ngx-avatars
                [name]="responsable.nombre"
                [size]="36"
                [bgColor]="responsable.color || '#D3152A'">
              </ngx-avatars>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-5 pt-3 border-top">
      <button
        type="submit"
        class="btn-rw-cta"
        [disabled]="form.invalid || guardando || (esNuevoComite && !comite.id)">
        <i class="bx bx-check-circle"></i>
        <span>{{ esNuevoComite ? 'CREAR COMITÉ' : 'GUARDAR CAMBIOS' }}</span>
      </button>
    </div>
  </form>
</p-dialog>
