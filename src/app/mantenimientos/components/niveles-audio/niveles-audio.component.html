<div class="mt-3 p-3 border rounded shadow-sm bg-light">
  <h6 class="fw-bold mb-2 text-primary">
    <i class="fas fa-volume-up me-2"></i>Niveles de Audio
  </h6>
  <p class="text-muted small mb-3">
    Sube o visualiza imágenes que sirvan como ejemplo de cómo deben estar correctamente nivelados los equipos de audio en esta sucursal.
  </p>

  <div class="d-flex gap-2 align-items-center">
    <!-- Input para subir (oculto y accionado por botón) -->
    <input type="file" #fileInputNiveles multiple accept="image/*" class="d-none" (change)="onFileSelected($event)">

    <button class="btn btn-outline-primary btn-sm" (click)="fileInputNiveles.click()">
      <i class="fas fa-upload me-1"></i> Subir imágenes
    </button>

    <button class="btn btn-outline-danger btn-sm" (click)="verImagenes()" [disabled]="!sucursal.imagenesNivelesAudio || sucursal.imagenesNivelesAudio.length === 0">
      <i class="fas fa-images me-1"></i> Ver imágenes ({{ sucursal.imagenesNivelesAudio?.length || 0 }})
    </button>
  </div>
</div>

<app-modal-visor-varias-imagenes
  *ngIf="mostrarVisorImagenes"
  [mostrarModal]="mostrarVisorImagenes"
  [imagenes]="imagenesVisor"
  titulo="Niveles de Audio - {{ sucursal.nombre }}"
  [mostrarBotonEliminar]="true"
  (closeEvent)="mostrarVisorImagenes = false"
  (imagenEliminadaEvent)="onImagenEliminada($event)">
</app-modal-visor-varias-imagenes>
