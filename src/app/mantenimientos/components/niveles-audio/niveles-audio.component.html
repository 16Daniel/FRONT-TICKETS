<section class="audio-levels-card">
  <div class="audio-levels-header">
    <div class="audio-levels-info">
      <div class="audio-icon-box">
        <i class="bx bx-slider-alt"></i>
      </div>

      <div class="audio-text-group">
        <div class="audio-title-row">
          <h4 class="audio-title">Niveles de Audio</h4>
          <span
            class="audio-count-pill"
            [class.has-images]="totalImagenes > 0">
            <span class="pill-dot"></span>
            <span>
              {{ totalImagenes }} {{ totalImagenes === 1 ? 'imagen' : 'imágenes' }}
            </span>
          </span>
        </div>

        <p class="audio-subtitle">
          Sube o visualiza imágenes que sirvan como ejemplo de cómo deben estar correctamente nivelados los equipos de audio en esta sucursal.
        </p>
      </div>
    </div>

    <div class="audio-levels-actions">
      <!-- Input oculto para selección múltiple -->
      <input
        type="file"
        #fileInputNiveles
        multiple
        accept="image/*"
        class="d-none"
        (change)="onFileSelected($event)" />

      <button
        type="button"
        class="btn-rw-secondary"
        [disabled]="totalImagenes === 0"
        (click)="verImagenes()">
        <i class="bx bx-images"></i>
        <span>Ver imágenes ({{ totalImagenes }})</span>
      </button>

      <button
        type="button"
        class="btn-rw-cta"
        (click)="fileInputNiveles.click()">
        <i class="bx bx-cloud-upload"></i>
        <span>Subir imágenes</span>
      </button>
    </div>
  </div>

  <!-- Vista previa rápida de miniaturas cuando existen imágenes -->
  <div class="audio-thumbs-strip" *ngIf="totalImagenes > 0">
    <button
      *ngFor="let imgUrl of imagenesAudio.slice(0, 5); let i = index"
      type="button"
      class="audio-thumb-item"
      (click)="verImagenes()"
      [title]="'Ver imagen de referencia ' + (i + 1)">
      <img [src]="imgUrl" [alt]="'Nivel de audio ' + (i + 1)" loading="lazy" />
      <span class="thumb-overlay">
        <i class="bx bx-zoom-in"></i>
      </span>
    </button>

    <button
      *ngIf="totalImagenes > 5"
      type="button"
      class="audio-thumb-more"
      (click)="verImagenes()">
      <span>+{{ totalImagenes - 5 }}</span>
      <small>más</small>
    </button>
  </div>
</section>

<app-modal-visor-varias-imagenes
  *ngIf="mostrarVisorImagenes"
  [mostrarModal]="mostrarVisorImagenes"
  [imagenes]="imagenesVisor"
  titulo="Niveles de Audio - {{ sucursal.nombre }}"
  [mostrarBotonEliminar]="true"
  (closeEvent)="mostrarVisorImagenes = false"
  (imagenEliminadaEvent)="onImagenEliminada($event)">
</app-modal-visor-varias-imagenes>
