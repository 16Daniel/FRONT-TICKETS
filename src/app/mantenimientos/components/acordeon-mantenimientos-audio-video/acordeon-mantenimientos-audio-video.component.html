<p-accordion class="custom-branches-accordion w-full">
  <p-accordionTab
    *ngFor="let item of (this.ordenarMantenimientosFecha ? ordenarSucursalesUserFecha(sucursales) : ordenarSucursalesUser(sucursales))">
    <ng-template pTemplate="header">
      <div class="branch-accordion-header" [ngClass]="obtenerClaseEstado(obtenerPorcentajedeUltimoMantenimiento(item.id))">
        <div class="branch-info-group">
          <div class="branch-count-badge">
            {{ obtenerPorcentajedeUltimoMantenimiento(item.id) }}%
          </div>
          <span class="branch-title">{{ item.nombre }}</span>
        </div>

        <div class="branch-actions-indicators">
          <span class="days-elapsed-badge" [class.days-expired]="obtenerDiasPasados(item.id.toString()) > 30">
            <i class="bx bx-time-five"></i>
            <span>{{ obtenerDiasPasados(item.id.toString()) }} DÍAS</span>
          </span>
        </div>
      </div>
    </ng-template>

    <div class="accordion-tables-wrapper">
      <tabla-mantenimientos-audio-video
        [mantenimientos]="filtrarMantenimientoPorSucursal(item.id)"
        [usuariosHelp]="usuariosHelp"
        [idSucursal]="item.id"
        [mostrarChat]="mostrarChat">
      </tabla-mantenimientos-audio-video>
    </div>
  </p-accordionTab>
</p-accordion>
