<p-dialog
  header="Chat de Mantenimiento"
  [modal]="true"
  [(visible)]="mostrarModal"
  [style]="{ width: '46rem', maxWidth: '92vw' }"
  [maximizable]="true"
  (onHide)="onHide()"
  styleClass="dialog-rw-chat">

  <div class="chat-viewport" *ngIf="mantenimiento != undefined" #chatContainer>
    <div *ngIf="!mantenimiento.comentarios || mantenimiento.comentarios.length === 0" class="chat-empty-state">
      <div class="empty-icon-circle">
        <i class="bx bx-conversation"></i>
      </div>
      <p class="empty-title">Sin mensajes aún</p>
      <p class="empty-subtitle">Inicia la conversación sobre este mantenimiento con tu equipo.</p>
    </div>

    <div class="chat-messages-list" *ngIf="mantenimiento.comentarios?.length">
      <div
        class="message-row"
        *ngFor="let item of mantenimiento.comentarios"
        [ngClass]="esmiId(item.idUsuario) ? 'row-me' : 'row-other'">

        <div class="chat-bubble" [ngClass]="esmiId(item.idUsuario) ? 'bubble-me' : 'bubble-other'">
          <span class="sender-name" *ngIf="!esmiId(item.idUsuario)">
            {{ item.nombre }}
          </span>

          <div class="message-content" [innerHTML]="item.comentario"></div>

          <span class="message-time">
            {{ datesHelper.getDate(item.fecha) | date: 'dd/MM hh:mm a' }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="chat-input-bar">
      <input
        type="text"
        class="chat-text-input"
        placeholder="Escribe un mensaje..."
        [(ngModel)]="comentario"
        (keyup.enter)="enviarComentarioChat()" />

      <button
        type="button"
        class="btn-send-message"
        (click)="enviarComentarioChat()"
        [disabled]="!comentario || !comentario.trim()"
        title="Enviar mensaje">
        <i class="bx bxs-send"></i>
      </button>
    </div>
  </ng-template>
</p-dialog>
