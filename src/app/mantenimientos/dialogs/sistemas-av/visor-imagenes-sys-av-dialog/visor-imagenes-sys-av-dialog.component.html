<p-dialog [header]="titulo" [modal]="true" [(visible)]="mostrarModal" [style]="{ width: '80vw', height: '80vh', maxWidth: '1000px' }" [maximizable]="true" (onHide)="onHide()" styleClass="modern-dialog">
  <div class="visor-container">
    <!-- Selector de dispositivo -->
    <div class="dispositivos" *ngIf="dispositivos.length > 1">
      <button *ngFor="let d of dispositivos; let i = index"
              (click)="dispositivoIndex = i; imagenSeleccionadaIndex = 0"
              [class.activo]="i === dispositivoIndex"
              class="btn-dispositivo">
        {{ d?.dispositivo?.nombre || ('Dispositivo ' + (i + 1)) }}
      </button>
    </div>

    <!-- Imagen principal -->
    <div class="contenedor-imagen">
      <button class="boton-eliminar-flotante" (click)="eliminarImagen()"
              *ngIf="imagenes!.length > 0 && mostrarBotonEliminar" title="Eliminar imagen">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          <line x1="10" x2="10" y1="11" y2="17"/>
          <line x1="14" x2="14" y1="11" y2="17"/>
        </svg>
      </button>
      <img [src]="imagenActual" alt="Imagen principal" class="imagen-principal"/>

      <!-- Navegación -->
      <button class="nav-button nav-prev" (click)="anterior()" [disabled]="imagenSeleccionadaIndex === 0" *ngIf="imagenes.length > 1">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <button class="nav-button nav-next" (click)="siguiente()" [disabled]="imagenSeleccionadaIndex === imagenes.length - 1" *ngIf="imagenes.length > 1">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>
    </div>

    <!-- Miniaturas -->
    <div class="miniaturas-container" *ngIf="imagenes.length > 1">
      <div class="contador-imagenes">
        {{ imagenSeleccionadaIndex + 1 }} / {{ imagenes.length }}
      </div>
      <div class="miniaturas">
        <div *ngFor="let img of imagenes; let i = index"
             class="miniatura"
             [class.seleccionada]="i === imagenSeleccionadaIndex"
             (click)="seleccionarImagen(i)">
          <img [src]="img" alt="Miniatura {{i + 1}}"/>
        </div>
      </div>
    </div>
  </div>
</p-dialog>
