<p-dialog
  header="Comentarios del Mantenimiento"
  [modal]="true"
  [(visible)]="mostrarModal"
  [style]="{ width: '48rem', maxWidth: '92vw' }"
  [maximizable]="true"
  (onHide)="onHide()"
  styleClass="dialog-rw-modal">

  <div class="comments-modal-body" *ngIf="mantenimiento">
    <div class="comments-card">
      <div class="comments-card-header">
        <div class="comments-badge">
          <i class="bx bx-comment-detail"></i>
          <span>Observaciones del Analista</span>
        </div>
      </div>

      <div class="comments-card-content">
        @if (mantenimiento.observaciones && mantenimiento.observaciones.trim().length > 0) {
          <div class="comments-text" [innerHTML]="mantenimiento.observaciones"></div>
        } @else {
          <div class="comments-empty-state">
            <i class="bx bx-message-rounded-x"></i>
            <p>Sin observaciones ni comentarios registrados para este mantenimiento.</p>
          </div>
        }
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="footer-actions">
      <button type="button" class="btn-rw-neutral" (click)="onHide()">
        <i class="pi pi-times"></i>
        <span>Cerrar</span>
      </button>
    </div>
  </ng-template>
</p-dialog>
