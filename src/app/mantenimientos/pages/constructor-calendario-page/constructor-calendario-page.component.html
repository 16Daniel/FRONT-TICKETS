<div class="constructor-page-wrapper">
  <div class="constructor-content-container">

    <!-- Cabecera Principal con Fecha a la Derecha -->
    <app-page-header
      subtitle="PROGRAMACIÓN Y AGENDA OPERATIVA"
      [title]="'Programar Visita' + (area?.nombre ? ' — ' + area.nombre : '')">
      <div class="current-date-pill">
        <i class="bx bx-calendar-event"></i>
        <span>{{ fecha | date:'fullDate':'':'es' | uppercase }}</span>
      </div>
    </app-page-header>

    <!-- Barra de Controles y Filtros Flotante -->
    <app-visita-filtros-toolbar
      [usuario]="usuario"
      [(usuarioSeleccionado)]="usuarioseleccionado"
      [(fecha)]="fecha"
      [(vercalendario)]="vercalendario"
      [(idArea)]="idArea"
      (usuariosHelpLoaded)="usuariosHelp = $event"
      (filtroChange)="llenarInfoUsuario()"
      (actividadCreada)="agregarActividad($event)">
    </app-visita-filtros-toolbar>

    <!-- Indicador de Carga -->
    <div class="d-flex justify-content-center my-5" *ngIf="loading">
      <div class="lds-ring">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>

    <!-- MODO PROGRAMADOR DE VISITAS -->
    <div *ngIf="!vercalendario && !loading" class="scheduler-workspace">

      <!-- Contenedor PickList -->
      <app-visita-sucursales-picklist
        [sucursales]="sucursales"
        [(sucursalesOrdenadas)]="sucursalesOrdenadas"
        [(sucursalesSeleccionadas)]="sucursalesSeleccionadas"
        [usuariosHelp]="usuariosHelp"
        [usuarioSeleccionado]="usuarioseleccionado"
        [usuarioActual]="usuario"
        [fecha]="fecha"
        [tickets]="tickets"
        [registroDeVisita]="registroDeVisita"
        [registroDeGuardia]="registroDeGuardia"
        (listasActualizadas)="actualizarListasComentarios()">
      </app-visita-sucursales-picklist>

      <!-- Sección de Indicaciones / Comentarios para la Visita -->
      <div class="comments-section-card mt-4" *ngIf="indicacionesVisitas.length > 0">
        <div class="comments-section-header">
          <div class="header-icon-box">
            <i class="bx bx-message-square-edit"></i>
          </div>
          <div>
            <h5 class="comments-title">Indicaciones y Comentarios para la Visita</h5>
            <p class="comments-subtitle">Agrega instrucciones específicas por sucursal para el analista asignado (opcional)</p>
          </div>
        </div>

        <div class="comments-list-grid mt-3">
          <div class="branch-comment-card" *ngFor="let item of indicacionesVisitas">
            <div class="branch-comment-header">
              <span class="branch-comment-badge">
                <i class="bx bx-store-alt"></i>
                <span>{{ obtenerNombreSucursal(item.idSucursal) }}</span>
              </span>
            </div>
            <p-editor
              [(ngModel)]="item.comentario"
              name="descripcion"
              styleClass="rw-custom-editor"
              [style]="{ height: '220px' }" />
          </div>
        </div>
      </div>

      <!-- Barra de Acción Inferior (Guardar / Actualizar) -->
      <div class="scheduler-footer-bar mt-4">
        <button
          *ngIf="registroDeVisita == undefined && registroDeGuardia == undefined"
          type="button"
          class="btn-rw-cta btn-rw-lg"
          [disabled]="usuarioseleccionado == undefined && loading == false"
          (click)="guardarVisita()">
          <i class="bx bx-save"></i>
          <span>GUARDAR VISITA</span>
        </button>

        <button
          *ngIf="registroDeVisita != undefined || registroDeGuardia != undefined"
          type="button"
          class="btn-rw-cta btn-rw-lg"
          [disabled]="usuarioseleccionado == undefined && loading == false"
          (click)="actualizar()">
          <i class="bx bx-refresh"></i>
          <span>ACTUALIZAR VISITA</span>
        </button>
      </div>
    </div>

    <!-- MODO VISTA CALENDARIO -->
    <div *ngIf="vercalendario" class="calendar-view-container mt-2">
      <app-calendario
        [usuariosHelp]="usuariosHelp"
        [tickets]="tickets"
        [idUsuarioFiltro]="usuarioseleccionado?.id"
        [idArea]="idArea">
      </app-calendario>
    </div>

  </div>
</div>

<app-detalle-ticket-dialog
  *ngIf="showModalTicketDetail"
  [ticket]="itemtk"
  [showModalTicketDetail]="showModalTicketDetail"
  (closeEvent)="showModalTicketDetail = false">
</app-detalle-ticket-dialog>

<p-toast
  [breakpoints]="{ '920px': { width: '100%', right: '0', left: '0' } }"
  [showTransformOptions]="'translateX(100%)'"
  [showTransitionOptions]="'500ms'"
  [hideTransitionOptions]="'500ms'">
</p-toast>
