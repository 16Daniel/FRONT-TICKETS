<!-- Header Navigation Bar (Fixed 64px) -->
<header class="erp-navbar">
  <div class="navbar-left">
    <button 
      type="button" 
      class="nav-toggle-btn" 
      (click)="toggleMenu()" 
      [attr.aria-expanded]="isMenuOpen" 
      aria-label="Abrir menú de navegación">
      <i class="bx" [ngClass]="isMenuOpen ? 'bx-x' : 'bx-menu'"></i>
    </button>
  </div>

  <div class="navbar-center">
    <div class="brand-container">
      <span class="branch-badge" *ngIf="tituloBanner">{{ tituloBanner }}</span>
    </div>
  </div>

  <div class="navbar-right">
    <app-alert-notifications-button></app-alert-notifications-button>
    <app-chat-notifications-button></app-chat-notifications-button>
  </div>
</header>
