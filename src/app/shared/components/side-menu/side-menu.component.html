<!-- Header Navigation Bar (Fixed 64px) -->
<header class="erp-navbar">
  <div class="navbar-left">
    <button 
      type="button" 
      class="nav-toggle-btn" 
      (click)="toggleMenu()" 
      [attr.aria-expanded]="showmenu" 
      aria-label="Abrir menú de navegación">
      <i class="bx" [ngClass]="showmenu ? 'bx-x' : 'bx-menu'"></i>
    </button>
  </div>

  <div class="navbar-center">
    <div class="brand-container">
      <span class="branch-badge" *ngIf="tituloBanner">{{ tituloBanner }}</span>
    </div>
  </div>

  <div class="navbar-right">
    <app-alert-notifications-button></app-alert-notifications-button>
    <app-chat-notifications-button></app-chat-notifications-button>
  </div>
</header>

<!-- Drawer Backdrop Overlay (only shown when unpinned) -->
<div 
  class="sidebar-backdrop" 
  *ngIf="showmenu && !isPinned" 
  (click)="closemenu()" 
  aria-hidden="true">
</div>

<!-- Sidebar Drawer -->
<aside 
  class="sidebar-drawer" 
  [class.is-open]="showmenu" 
  [class.is-pinned]="isPinned" 
  role="navigation" 
  aria-label="Menú principal">
  <!-- Drawer Header -->
  <div class="drawer-header">
    <div class="drawer-brand">
      <img 
        [src]="logoUrl" 
        (error)="onLogoError()" 
        alt="REBEL UP" 
        class="drawer-logo" />
    </div>
    <div class="drawer-actions">
      <button 
        type="button" 
        class="pin-drawer-btn" 
        (click)="togglePin()" 
        [title]="isPinned ? 'Desanclar menú' : 'Anclar menú'" 
        [attr.aria-label]="isPinned ? 'Desanclar menú' : 'Anclar menú'">
        <i class="bx" [ngClass]="isPinned ? 'bxs-pin active-pin' : 'bx-pin'"></i>
      </button>

      <button 
        type="button" 
        class="close-drawer-btn" 
        (click)="closemenu()" 
        aria-label="Cerrar menú">
        <i class="bx bx-x"></i>
      </button>
    </div>
  </div>

  <!-- Scrollable Menu Content: Dinámico según los Permisos de Firebase -->
  <div class="drawer-content">
    
    <div class="nav-group" *ngFor="let grupo of (gruposMenuVisibles$ | async)">
      <span class="nav-group-title">{{ grupo.tituloGrupo }}</span>

      <ng-container *ngFor="let menu of grupo.menus">
        <!-- Rutas estándar de Angular Router -->
        <a 
          *ngIf="!menu.esAccionExterna"
          [routerLink]="menu.ruta" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: menu.exactMatch || false }"
          (click)="closemenu()" 
          class="nav-item">
          <i [class]="menu.icono + ' nav-icon'"></i>
          <span class="nav-label">{{ menu.titulo }}</span>
        </a>

        <!-- Enlace especial: Validador de cupones -->
        <a 
          *ngIf="menu.esAccionExterna && menu.tipoAccionExterna === 'cupones'"
          href="javascript:void(0)" 
          (click)="abrirValidadorCupones($event)" 
          class="nav-item">
          <i class="bx nav-icon" [ngClass]="isCheckingValidadorCupones ? 'bx-loader-alt bx-spin' : 'bx-check-shield'"></i>
          <span class="nav-label">{{ menu.titulo }}</span>
          <i class="bx bx-link-external external-icon" *ngIf="!isCheckingValidadorCupones"></i>
        </a>

        <!-- Enlace especial: Validador de consumos -->
        <a 
          *ngIf="menu.esAccionExterna && menu.tipoAccionExterna === 'consumos'"
          href="javascript:void(0)" 
          (click)="abrirValidadorConsumos($event)" 
          class="nav-item">
          <i class="bx nav-icon" [ngClass]="isCheckingValidadorConsumos ? 'bx-loader-alt bx-spin' : 'bx-receipt'"></i>
          <span class="nav-label">{{ menu.titulo }}</span>
          <i class="bx bx-link-external external-icon" *ngIf="!isCheckingValidadorConsumos"></i>
        </a>
      </ng-container>
    </div>

  </div>

  <!-- Drawer Footer: Barra compacta de usuario con acciones integradas -->
  <div class="drawer-footer-compact" *ngIf="usuario">
    <!-- Usuario PIN Activo -->
    <div class="compact-user-bar" *ngIf="responsable">
      <div class="user-avatar-compact">
        <ngx-avatars 
          [name]="responsable.nombre" 
          [size]="34" 
          [bgColor]="responsable.color || '#D3152A'">
        </ngx-avatars>
        <span class="compact-pin-dot" title="PIN activo"></span>
      </div>

      <div class="compact-user-info" [title]="responsable.nombre + ' (' + (responsable.posicion || 'Responsable en turno') + ')'">
        <div class="compact-user-name">{{ responsable.nombre }}</div>
        <div class="compact-user-role">{{ responsable.posicion || 'Responsable en turno' }}</div>
      </div>

      <div class="compact-actions">
        <button 
          type="button" 
          class="compact-action-btn" 
          (click)="cambiarUsuarioPin()" 
          pTooltip="Cambiar usuario PIN" 
          tooltipPosition="top"
          aria-label="Cambiar usuario PIN">
          <i class="bx bx-user-pin"></i>
        </button>

        <button 
          type="button" 
          class="compact-action-btn btn-logout" 
          (click)="logout()" 
          pTooltip="Cerrar sesión" 
          tooltipPosition="top"
          aria-label="Cerrar sesión">
          <i class="bx bx-log-out"></i>
        </button>
      </div>
    </div>

    <!-- Si no hay usuario PIN -->
    <div class="compact-user-bar unassigned-bar" *ngIf="!responsable">
      <div class="user-avatar-compact empty-avatar-compact" (click)="cambiarUsuarioPin()">
        <i class="bx bx-user-pin"></i>
      </div>

      <div class="compact-user-info cursor-pointer" (click)="cambiarUsuarioPin()">
        <div class="compact-user-name text-danger">Sin usuario PIN</div>
        <div class="compact-user-role">Clic para asignar</div>
      </div>

      <div class="compact-actions">
        <button 
          type="button" 
          class="compact-action-btn btn-highlight-pin" 
          (click)="cambiarUsuarioPin()" 
          pTooltip="Asignar usuario PIN" 
          tooltipPosition="top"
          aria-label="Asignar usuario PIN">
          <i class="bx bx-plus-circle"></i>
        </button>

        <button 
          type="button" 
          class="compact-action-btn btn-logout" 
          (click)="logout()" 
          pTooltip="Cerrar sesión" 
          tooltipPosition="top"
          aria-label="Cerrar sesión">
          <i class="bx bx-log-out"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Versión de la aplicación -->
  <div class="drawer-version">v{{ appVersion }}</div>
</aside>
